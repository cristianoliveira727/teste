<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OLIV FILMS — Controle Patrimonial Audiovisual</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Decodificador Óptico QR Code jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <!-- Tipografia Cinematográfica & Técnica -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --oliv-black: #080808;
      --oliv-red: #C8102E;
      --oliv-silver: #C0C0C0;
      --oliv-graphite: #181818;
      --oliv-white: #F5F5F5;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #C0C0C0 #181818;
    }

    body {
      background-color: #080808;
      color: #F5F5F5;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fadeIn {
      animation: fadeIn 0.22s ease-out forwards;
    }

    @keyframes laserScan {
      0%, 100% { transform: translateY(-48px); }
      50% { transform: translateY(48px); }
    }

    .laser-line {
      animation: laserScan 2s ease-in-out infinite;
    }

    /* Tela de inicialização — Oliv Films */
    #oliv-boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080808;
      color: #F5F5F5;
      opacity: 1;
      visibility: visible;
      transition: opacity .28s ease, visibility .28s ease;
    }
    #oliv-boot-screen.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .oliv-boot-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 360px);
      padding: 34px 28px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px;
      background: #181818;
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
      text-align: center;
    }
    .oliv-boot-logo {
      display: block;
      width: 160px;
      height: auto;
      max-width: 100%;
      max-height: none;
      object-fit: contain;
      object-position: center;
      overflow: visible;
      margin: 0 auto 22px;
    }
    .oliv-boot-fallback {
      display: none;
      margin-bottom: 22px;
      color: #fff;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: .18em;
    }
    .oliv-boot-spinner {
      width: 30px;
      height: 30px;
      margin-top: 26px;
      border: 3px solid rgba(255,255,255,.14);
      border-top-color: #C8102E;
      border-right-color: #C8102E;
      border-radius: 50%;
      animation: olivBootSpin .85s linear infinite;
    }
    .oliv-boot-status {
      margin-top: 13px;
      color: #C0C0C0;
      font: 700 10px/1.5 'JetBrains Mono', monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    @keyframes olivBootSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #oliv-boot-screen { transition: none; }
      .oliv-boot-spinner { animation-duration: 2.5s; }
    }

    /* Impressão limpa de etiquetas e relatórios */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #oliv-printable-area,
      #oliv-printable-area * {
        visibility: visible !important;
      }
      #oliv-printable-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        background: #FFFFFF !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[#080808] text-[#F5F5F5] selection:bg-[#C8102E] selection:text-white">

  <!-- Tela inicial exibida enquanto a sessão e os dados são verificados -->
  <div id="oliv-boot-screen" role="status" aria-live="polite" aria-label="Carregando sistema Oliv Films">
    <div class="oliv-boot-card">
      <img
        class="oliv-boot-logo"
        src="/teste/assets/oliv-films-logo.webp"
        alt="Oliv Films"
        onerror="this.style.display='none'; var fallback=document.getElementById('oliv-boot-fallback'); if(fallback) fallback.style.display='block';"
      />
      <div id="oliv-boot-fallback" class="oliv-boot-fallback">OLIV FILMS</div>
      <div class="text-[10px] font-bold tracking-[.28em] text-[#C0C0C0] uppercase">Controle Patrimonial Audiovisual</div>
      <div class="oliv-boot-spinner" aria-hidden="true"></div>
      <div class="oliv-boot-status">Inicializando sistema patrimonial...</div>
    </div>
  </div>

  <!-- CONTAINER RAIZ DA APLICAÇÃO -->
  <div id="app-root"></div>

  <!-- ELEMENTOS OCULTOS AUXILIARES PARA CÂMERA E UPLOAD -->
  <canvas id="qr-decode-canvas" class="hidden"></canvas>

  <!-- SCRIPT COMPLETO DO SISTEMA OLIV FILMS (VANILLA JS PURO) -->
  <script>
    // =========================================================================
    // 1. DADOS INICIAIS DO ACERVO PATRIMONIAL & USUÁRIOS OLIV FILMS
    // =========================================================================
    const INITIAL_CATEGORIES = [];

    const INITIAL_LOCATIONS = [];

    // Usuários e credenciais são gerenciados exclusivamente pelo Supabase Auth.

    const INITIAL_MODELS = [];

    const INITIAL_UNITS = [];

    const INITIAL_MOVEMENTS = [];

    const DEFAULT_SETTINGS = {
      companyName: 'OLIV FILMS',
      companyTagline: 'CAPTURANDO GRANDES HISTÓRIAS',
      codePrefix: 'OLF',
      logoFile: 'Oliv_Films_simbolo_4K.jpg',
      logoDataUrl: '',
      qrLinkMode: 'WHATSAPP', // 'WHATSAPP' | 'DIRECTORY' | 'CUSTOM_URL'
      ownerContactName: '',
      ownerWhatsapp: '',
      ownerPhoneDisplay: '',
      ownerEmail: '',
      ownerAddress: '',
      lostFoundMessage: 'Este equipamento pertence ao acervo patrimonial da produtora OLIV FILMS. Caso tenha encontrado este item fora de operação, entre em contato imediatamente pelos canais abaixo para devolução.',
      customDirectoryUrl: ''
    };

    // =========================================================================
    // 2. MOTOR DE QR CODE REAL PADRÃO ISO/IEC 18004 (REED-SOLOMON GF 256)
    // =========================================================================
    const QR_GF_EXP = new Uint8Array(512);
    const QR_GF_LOG = new Uint8Array(256);
    (() => {
      let x = 1;
      for (let i = 0; i < 255; i++) {
        QR_GF_EXP[i] = x;
        QR_GF_LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) {
        QR_GF_EXP[i] = QR_GF_EXP[i - 255];
      }
    })();

    function qrGfMul(a, b) {
      return a === 0 || b === 0 ? 0 : QR_GF_EXP[QR_GF_LOG[a] + QR_GF_LOG[b]];
    }

    function buildRsGeneratorPoly(degree) {
      let poly = [1];
      for (let i = 0; i < degree; i++) {
        const next = new Array(poly.length + 1).fill(0);
        const factor = QR_GF_EXP[i];
        for (let j = 0; j < poly.length; j++) {
          next[j] ^= poly[j];
          next[j + 1] ^= qrGfMul(poly[j], factor);
        }
        poly = next;
      }
      return poly;
    }

    function computeRsEcc(dataBytes, eccCount) {
      const gen = buildRsGeneratorPoly(eccCount);
      const res = new Array(eccCount).fill(0);
      for (let i = 0; i < dataBytes.length; i++) {
        const factor = dataBytes[i] ^ res[0];
        res.shift();
        res.push(0);
        if (factor !== 0) {
          for (let j = 0; j < eccCount; j++) {
            res[j] ^= qrGfMul(gen[j + 1], factor);
          }
        }
      }
      return res;
    }

    const QR_VERSION_SPECS = [
      null,
      { version: 1, size: 21, dataCapacity: 19, eccCount: 7, maxPayload: 17, alignPos: null },
      { version: 2, size: 25, dataCapacity: 34, eccCount: 10, maxPayload: 32, alignPos: 18 },
      { version: 3, size: 29, dataCapacity: 55, eccCount: 15, maxPayload: 53, alignPos: 22 },
      { version: 4, size: 33, dataCapacity: 80, eccCount: 20, maxPayload: 78, alignPos: 26 },
      { version: 5, size: 37, dataCapacity: 108, eccCount: 26, maxPayload: 106, alignPos: 30 }
    ];

    function encodeRealQRMatrix(text) {
      const rawBytes = new TextEncoder().encode(String(text || 'OLF-EQP-000001'));
      let spec = QR_VERSION_SPECS[5];
      for (let v = 1; v <= 5; v++) {
        if (rawBytes.length <= QR_VERSION_SPECS[v].maxPayload) {
          spec = QR_VERSION_SPECS[v];
          break;
        }
      }

      const { version, size, dataCapacity, eccCount, maxPayload, alignPos } = spec;
      const payloadBytes = rawBytes.slice(0, maxPayload);

      const bits = [];
      const pushBits = (val, len) => {
        for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
      };

      pushBits(0b0100, 4);
      pushBits(payloadBytes.length, 8);
      for (let i = 0; i < payloadBytes.length; i++) pushBits(payloadBytes[i], 8);
      const terminatorLen = Math.min(4, dataCapacity * 8 - bits.length);
      pushBits(0, terminatorLen);
      while (bits.length % 8 !== 0) bits.push(0);

      const dataBytes = [];
      for (let i = 0; i < bits.length; i += 8) {
        let byteVal = 0;
        for (let b = 0; b < 8; b++) byteVal = (byteVal << 1) | bits[i + b];
        dataBytes.push(byteVal);
      }

      const padPatterns = [0xec, 0x11];
      let padIdx = 0;
      while (dataBytes.length < dataCapacity) {
        dataBytes.push(padPatterns[padIdx % 2]);
        padIdx++;
      }

      const eccBytes = computeRsEcc(dataBytes, eccCount);
      const allCodewords = [...dataBytes, ...eccBytes];

      const modules = Array.from({ length: size }, () => Array(size).fill(0));
      const isFunction = Array.from({ length: size }, () => Array(size).fill(false));

      const setFunctionModule = (r, c, val) => {
        if (r >= 0 && r < size && c >= 0 && c < size) {
          modules[r][c] = val ? 1 : 0;
          isFunction[r][c] = true;
        }
      };

      const placeFinder = (row, col) => {
        for (let r = -1; r <= 7; r++) {
          for (let c = -1; c <= 7; c++) {
            const isBlack =
              r >= 0 && r <= 6 && c >= 0 && c <= 6 &&
              (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
            setFunctionModule(row + r, col + c, isBlack);
          }
        }
      };

      placeFinder(0, 0);
      placeFinder(0, size - 7);
      placeFinder(size - 7, 0);

      if (version >= 2 && alignPos) {
        for (let r = -2; r <= 2; r++) {
          for (let c = -2; c <= 2; c++) {
            const isBlack = Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0);
            setFunctionModule(alignPos + r, alignPos + c, isBlack);
          }
        }
      }

      for (let i = 8; i < size - 8; i++) {
        setFunctionModule(6, i, i % 2 === 0);
        setFunctionModule(i, 6, i % 2 === 0);
      }

      setFunctionModule(size - 8, 8, 1);

      for (let i = 0; i < 9; i++) {
        if (i !== 6) {
          isFunction[8][i] = true;
          isFunction[i][8] = true;
        }
      }
      for (let i = 0; i < 8; i++) isFunction[8][size - 1 - i] = true;
      for (let i = 0; i < 7; i++) isFunction[size - 1 - i][8] = true;

      const dataBits = [];
      allCodewords.forEach((cw) => {
        for (let b = 7; b >= 0; b--) dataBits.push((cw >>> b) & 1);
      });

      let bitPtr = 0;
      let upward = true;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (let step = 0; step < size; step++) {
          const r = upward ? size - 1 - step : step;
          for (let dx = 0; dx < 2; dx++) {
            const c = right - dx;
            if (!isFunction[r][c]) {
              modules[r][c] = bitPtr < dataBits.length ? dataBits[bitPtr++] : 0;
            }
          }
        }
        upward = !upward;
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!isFunction[r][c] && (r + c) % 2 === 0) {
            modules[r][c] ^= 1;
          }
        }
      }

      const formatBits = 0x77c4;
      const formatCoords1 = [
        [8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
        [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]
      ];
      const formatCoords2 = [
        [size - 1, 8], [size - 2, 8], [size - 3, 8], [size - 4, 8], [size - 5, 8], [size - 6, 8], [size - 7, 8],
        [8, size - 8], [8, size - 7], [8, size - 6], [8, size - 5], [8, size - 4], [8, size - 3], [8, size - 2], [8, size - 1]
      ];

      for (let i = 0; i < 15; i++) {
        const bit = (formatBits >>> (14 - i)) & 1;
        const [r1, c1] = formatCoords1[i];
        const [r2, c2] = formatCoords2[i];
        modules[r1][c1] = bit;
        modules[r2][c2] = bit;
      }

      return { modules, size };
    }

    function buildEquipmentQRPayload(code = 'OLF-EQP-000001', settings = {}) {
      const cleanCode = String(code || 'OLF-EQP-000001').trim().toUpperCase();
      const mode = settings?.qrLinkMode || 'WHATSAPP';
      const rawPhone = String(settings?.ownerWhatsapp || '5571999999999').replace(/\D/g, '');

      if (mode === 'WHATSAPP' && rawPhone) {
        const msg = encodeURIComponent(`Achei equipamento OLIV FILMS ${cleanCode}`);
        return `https://wa.me/${rawPhone}?text=${msg}`;
      }

      if (mode === 'CUSTOM_URL' && settings?.customDirectoryUrl) {
        const base = settings.customDirectoryUrl.trim().replace(/\/$/, '');
        const sep = base.includes('?') ? '&' : '?';
        return `${base}${sep}eqp=${cleanCode}`;
      }

      const origin =
        typeof window !== 'undefined' && window.location?.origin && window.location.origin !== 'null'
          ? window.location.origin + window.location.pathname
          : 'https://olivfilms.com.br/';
      const cleanOrigin = origin.endsWith('/') ? origin.slice(0, -1) : origin;
      return `${cleanOrigin}/?achado=${cleanCode}`;
    }

    function renderQRCodeSVG(code = 'OLF-EQP-000000', payload = null, size = 84, showLabel = true) {
      const qrText = payload || code;
      const { modules, size: gridSize } = encodeRealQRMatrix(qrText);
      const quietZone = 2;
      const totalDim = gridSize + quietZone * 2;

      let rects = '';
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (modules[r][c] === 1) {
            rects += `<rect x="${c + quietZone}" y="${r + quietZone}" width="1" height="1" fill="#000000" />`;
          }
        }
      }

      return `
        <div class="inline-flex flex-col items-center justify-center bg-white p-2 rounded-lg border border-neutral-300 shadow-sm shrink-0">
          <svg width="${size}" height="${size}" style="width:${size}px;height:${size}px;display:block" viewBox="0 0 ${totalDim} ${totalDim}" shape-rendering="crispEdges" aria-label="QR Code ${escapeHtml(code)}">
            <rect width="${totalDim}" height="${totalDim}" fill="#FFFFFF" />
            ${rects}
          </svg>
          ${showLabel ? `<span class="mt-1.5 font-mono text-[10px] font-black tracking-wider text-black leading-none">${escapeHtml(code)}</span>` : ''}
        </div>
      `;
    }

    // =========================================================================
    // 2B. IDENTIDADE VISUAL ORIGINAL OLIV FILMS (SEM ALTERAÇÕES OU EFEITOS)
    // =========================================================================
    function renderOlivFilmsLogo(size = 'md', extraClasses = '') {
      const dims = {
        sm: 'h-10 max-w-[120px]',
        md: 'h-24 max-w-[200px]',
        lg: 'h-36 sm:h-40 max-w-[260px]'
      }[size] || 'h-24 max-w-[200px]';

      const logoSrc = (state && state.companySettings && state.companySettings.logoDataUrl)
        ? state.companySettings.logoDataUrl
        : '/teste/assets/oliv-films-logo.webp';

      return `
        <div class="inline-flex items-center justify-center ${dims} ${extraClasses}">
          <img
            src="${logoSrc}"
            alt="Oliv Films — Símbolo Exclusivo"
            class="h-full w-auto max-w-full object-contain block"
            onerror="this.style.display='none'; if (this.nextElementSibling) this.nextElementSibling.style.display='inline-flex';"
          />
          <label
            onclick="event.stopPropagation()"
            style="display:none"
            title="Selecione o arquivo original Oliv_Films_simbolo_4K.jpg sem alterações"
            class="h-full px-3 rounded-lg border border-dashed border-white/25 hover:border-[#C0C0C0] text-[10px] font-semibold text-white/80 hover:text-[#C0C0C0] items-center justify-center text-center cursor-pointer transition-colors"
          >
            <span>Carregar arquivo original<br/>Oliv_Films_simbolo_4K.jpg</span>
            <input type="file" accept="image/*" data-action="load-original-logo" class="hidden" />
          </label>
        </div>
      `;
    }

    // =========================================================================
    // 3. ESTADO GLOBAL DA APLICAÇÃO E PERSISTÊNCIA LOCALSTORAGE
    // =========================================================================
    const STORAGE_KEY = 'oliv_films_patrimonio_v2';

    function loadSavedData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn('LocalStorage indisponível:', e);
      }
      return null;
    }

    const savedData = loadSavedData();

    const state = {
      isAuthenticated: false,
      currentUser: null,
      authScreenMode: 'LOGIN',
      authEmail: '',
      authPassword: '',
      authError: '',
      activeTab: 'dashboard',
      globalSearch: '',
      units: savedData?.units || JSON.parse(JSON.stringify(INITIAL_UNITS)),
      models: savedData?.models || JSON.parse(JSON.stringify(INITIAL_MODELS)),
      categories: savedData?.categories || JSON.parse(JSON.stringify(INITIAL_CATEGORIES)),
      locations: savedData?.locations || JSON.parse(JSON.stringify(INITIAL_LOCATIONS)),
      users: [],
      movements: savedData?.movements || JSON.parse(JSON.stringify(INITIAL_MOVEMENTS)),
      companySettings: Object.assign({}, DEFAULT_SETTINGS, savedData?.companySettings || {}),
      inventoryViewMode: 'CARDS',
      invCatFilter: 'TODAS',
      invStatusFilter: 'TODOS',
      invLocFilter: 'TODAS',
      regName: '',
      regBrandModel: '',
      regCategory: 'Câmeras',
      regSerialNumber: '',
      regLocation: INITIAL_LOCATIONS[0],
      regCondition: 'Perfeito',
      regDescription: '',
      regAccessories: [],
      regEditUnitId: null,
      regPhotos: [],
      scannedUnitId: null,
      scannerActiveOp: null,
      scannerCameraActive: false,
      scannerFacingMode: 'environment',
      scannerErrorMsg: '',
      scannerExpectedReturn: '2026-11-19T19:00',
      scannerReturnedBy: '',
      historyTypeFilter: 'TODOS',
      historySearch: '',
      selectedReport: 'PATRIMONIO_GERAL',
      selectedUnitDetailId: null,
      printableDocument: null,
      labelLayout: 'A4_GRID',
      lostFoundUnit: null,
      mobileMenuOpen: false,
      showNotificationsDrawer: false,
      showUserMenu: false
    };

    // =========================================================================
    // 3A. AUTENTICAÇÃO E CAMADA DE DADOS SUPABASE
    // =========================================================================
    const supabaseClient = window.olivSupabase || null;
    let cloudReady = false;
    let cloudWriteQueue = Promise.resolve();
    let profileRealtimeChannel = null;
    let profileStatusPollId = null;
    let dataRealtimeChannel = null;
    let realtimeRenderTimer = null;
    let accessRevocationInProgress = false;

    function scheduleRealtimeRender() {
      if (state.activeTab === 'register') return;
      if (realtimeRenderTimer !== null) window.clearTimeout(realtimeRenderTimer);
      realtimeRenderTimer = window.setTimeout(() => {
        realtimeRenderTimer = null;
        if (state.isAuthenticated && state.activeTab !== 'register') renderApp();
      }, 220);
    }

    function applyRealtimeRow(table, payload) {
      const stateKeyByTable = {
        equipment: 'units',
        equipment_models: 'models',
        categories: 'categories',
        locations: 'locations',
        movements: 'movements'
      };
      const stateKey = stateKeyByTable[table];
      if (!stateKey) return;
      const eventType = payload.eventType;
      const row = eventType === 'DELETE' ? payload.old : payload.new;
      console.info('[Oliv Films] Evento Realtime recebido:', table, eventType, row?.id ?? '(sem ID)');
      if (!row || row.id === undefined || row.id === null) return;
      const rows = Array.isArray(state[stateKey]) ? state[stateKey] : [];
      const id = String(row.id);
      if (eventType === 'DELETE') {
        state[stateKey] = rows.filter(item => String(typeof item === 'string' ? item : item.id) !== id);
      } else if (row.data !== undefined) {
        const index = rows.findIndex(item => String(typeof item === 'string' ? item : item.id) === id);
        if (index >= 0) rows[index] = row.data;
        else rows.push(row.data);
        state[stateKey] = rows;
      }
      // Eventos remotos nunca devem disparar persistState(): isso poderia
      // sobrescrever ou excluir registros de outros usuários.
      // Nunca reconstruir o formulário de cadastro durante o preenchimento.
      scheduleRealtimeRender();
    }

    function subscribeToOperationalData() {
      if (!supabaseClient || dataRealtimeChannel || !state.isAuthenticated) return;
      const tables = ['equipment', 'equipment_models', 'categories', 'locations', 'movements'];
      let channel = supabaseClient.channel('oliv-operational-data');
      for (const table of tables) {
        channel = channel.on('postgres_changes', {
          event: '*', schema: 'public', table
        }, payload => applyRealtimeRow(table, payload));
      }
      dataRealtimeChannel = channel.subscribe((status, error) => {
        console.info('[Oliv Films] Estado da sincronização Realtime:', status);
        if (error) console.error('[Oliv Films] Falha na sincronização em tempo real:', error);
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('[Oliv Films] Sincronização em tempo real indisponível; atualize os dados manualmente se necessário.');
        }
      });
    }

    function profileToUser(profile) {
      return {
        id: profile.id, name: profile.full_name || profile.email || 'Usuário',
        email: profile.email || '', department: profile.department || 'Equipe Oliv Films',
        role: roleFromDatabase(profile.role), status: profile.status === 'approved' ? 'APROVADO' : profile.status === 'blocked' ? 'BLOQUEADO' : 'PENDENTE',
        isPrimaryAdmin: profile.role === 'admin'

    function stopProfileRealtime() {
      if (profileStatusPollId !== null) {
        clearInterval(profileStatusPollId);
        profileStatusPollId = null;
      }
      if (profileRealtimeChannel && supabaseClient) {
        supabaseClient.removeChannel(profileRealtimeChannel);
        profileRealtimeChannel = null;
      }
    }

    function subscribeToOwnProfile(userId) {
      stopProfileRealtime();
      if (!supabaseClient || !userId) return;
      // Fallback confiável: verifica o próprio perfil a cada 3 segundos.
      // A consulta respeita RLS e não depende da publicação Realtime.
      const verifyOwnProfile = async () => {
        if (!state.isAuthenticated || !state.currentUser || state.currentUser.id !== userId || accessRevocationInProgress) return;
        try {
          const { data: profile, error } = await supabaseClient
            .from('profiles')
            .select('id,full_name,email,department,role,status')
            .eq('id', userId)
            .maybeSingle();
          if (error) {
            console.warn('[Oliv Films] Não foi possível verificar o status da conta:', error.message);
            return;
          }
          if (!profile) return;
          const updatedUser = profileToUser(profile);
          state.currentUser = updatedUser;
          if (updatedUser.status !== 'APROVADO') {
            accessRevocationInProgress = true;
            await handleLogout('Seu acesso ao Oliv Films foi bloqueado ou suspenso pelo administrador.');
            accessRevocationInProgress = false;
            return;
          }
          // Não reconstruir a interface durante a verificação periódica:
          // isso interromperia formulários que o usuário esteja preenchendo.
        } catch (error) {
          console.warn('[Oliv Films] Falha temporária ao verificar o status da conta:', error);
        }
      };
      if (profileStatusPollId !== null) clearInterval(profileStatusPollId);
      profileStatusPollId = setInterval(verifyOwnProfile, 3000);

      profileRealtimeChannel = supabaseClient
        .channel('oliv-profile-' + userId)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'profiles',
          filter: 'id=eq.' + userId
        }, async (payload) => {
          const profile = payload.new;
          if (!profile || !state.currentUser || state.currentUser.id !== userId) return;
          const updatedUser = profileToUser(profile);
          state.currentUser = updatedUser;
          if (updatedUser.status !== 'APROVADO' && !accessRevocationInProgress) {
            accessRevocationInProgress = true;
            stopLiveScannerCamera();
            await handleLogout('Seu acesso ao Oliv Films foi bloqueado ou suspenso pelo administrador.');
            accessRevocationInProgress = false;
            return;
          }
          // Atualiza os dados de acesso em memória sem reconstruir a tela.
          // A interface permanece estável enquanto formulários estiverem abertos.
        })
        .subscribe((status, error) => {
          if (error) console.error('[Oliv Films] Falha no monitoramento do perfil:', error);
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            console.warn('[Oliv Films] Monitoramento em tempo real indisponível; a proteção do banco continua ativa.');
          }
        });
    }

    async function loadCloudData(profile) {
      const loadStartedAt = performance.now();
      if (!supabaseClient) throw new Error('Conexão Supabase não inicializada.');
      if (!profile?.id) throw new Error('Perfil da sessão não encontrado.');
      const tables = [
        ['equipment', 'units'], ['equipment_models', 'models'],
        ['categories', 'categories'], ['locations', 'locations'],
        ['movements', 'movements']
      ];

      // O perfil já foi consultado no início do login. Reutilizá-lo evita
      // uma segunda consulta de rede e reduz o tempo até a tela principal.
      const tableResults = await Promise.all(tables.map(async ([table, key]) => {
        const startedAt = performance.now();
        const { data, error } = await supabaseClient.from(table).select('id,data');
        console.info('[Oliv Films] Tempo de carregamento:', table, Math.round(performance.now() - startedAt) + ' ms');
        if (error) {
          console.error('[Oliv Films] Falha ao carregar tabela:', table, {
            code: error.code, message: error.message, details: error.details, hint: error.hint
          });
          throw new Error('Falha ao carregar ' + table + ': ' + error.message);
        }
        return [key, (data || []).map(row => row.data)];
      }));
      tableResults.forEach(([key, value]) => { state[key] = value; });

      const settingsStartedAt = performance.now();
      const settingsResult = await supabaseClient.from('company_settings')
        .select('data').eq('id', 'default').maybeSingle();
      console.info('[Oliv Films] Tempo de carregamento: company_settings', Math.round(performance.now() - settingsStartedAt) + ' ms');
      if (settingsResult.error) {
        console.error('[Oliv Films] Falha ao carregar company_settings:', settingsResult.error);
        throw new Error('Falha ao carregar configurações: ' + settingsResult.error.message);
      }
      state.companySettings = Object.assign({}, DEFAULT_SETTINGS, settingsResult.data?.data || {});
      state.currentUser = profileToUser(profile);
      if (state.currentUser.role === 'ADMIN') {
        const profilesStartedAt = performance.now();
        const { data: profiles, error: profilesError } = await supabaseClient.from('profiles').select('*').order('created_at');
        console.info('[Oliv Films] Tempo de carregamento: lista de usuários', Math.round(performance.now() - profilesStartedAt) + ' ms');
        if (profilesError) {
          console.error('[Oliv Films] Falha ao carregar lista de perfis:', profilesError);
          throw new Error('Falha ao carregar usuários: ' + profilesError.message);
        }
        state.users = (profiles || []).map(profileToUser);
      } else {
        state.users = [state.currentUser];
      }
      cloudReady = true;
      console.info('[Oliv Films] Tempo total dos dados operacionais:', Math.round(performance.now() - loadStartedAt) + ' ms');
    }
    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          units: state.units, models: state.models, categories: state.categories,
          locations: state.locations, users: state.users, movements: state.movements,
          companySettings: state.companySettings
        }));
      } catch (e) { console.warn('Erro ao salvar cópia local:', e); }

      if (!cloudReady || !supabaseClient || !state.currentUser) return;
      cloudWriteQueue = cloudWriteQueue.then(async () => {
        const canManage = ['ADMIN', 'GERENCIADOR'].includes(state.currentUser.role);
        const groups = canManage
          ? [
              ['equipment', state.units], ['equipment_models', state.models],
              ['categories', state.categories], ['locations', state.locations],
              ['movements', state.movements]
            ]
          : [['equipment', state.units], ['movements', state.movements]];
        for (const [table, items] of groups) {
          const rows = (items || []).map(item => ({ id: typeof item === 'string' ? item : String(item.id), data: item }));
          if (rows.length) {
            const { error } = await supabaseClient.from(table).upsert(rows, { onConflict: 'id' });
            if (error) throw error;
          }
          if (canManage) {
            const keep = rows.map(row => row.id);
            const { data: existing, error: readError } = await supabaseClient.from(table).select('id');
            if (readError) throw readError;
            const stale = (existing || []).map(row => row.id).filter(id => !keep.includes(id));
            if (stale.length) {
              const { error } = await supabaseClient.from(table).delete().in('id', stale);
              if (error) throw error;
            }
          }
        }
        if (canManage) {
          const { error: settingsError } = await supabaseClient.from('company_settings')
            .upsert({ id: 'default', data: state.companySettings }, { onConflict: 'id' });
          if (settingsError) throw settingsError;
        }
      }).catch(error => {
        console.error('[Oliv Films] Falha ao sincronizar:', error);
        notify('Não foi possível sincronizar com a nuvem. Seus dados locais foram mantidos.', 'error');
      });
    }

    async function finishCloudLogin(sessionUser, source = 'não identificado') {
      const loginStartedAt = performance.now();
      console.info('[Oliv Films] Início do carregamento da conta. Origem:', source);
      try {
        console.info('[Oliv Films] Login: consultando perfil...');
        const profileStartedAt = performance.now();
        const { data: profile, error } = await supabaseClient.from('profiles')
          .select('*').eq('id', sessionUser.id).single();
        console.info('[Oliv Films] Tempo de autenticação + perfil:', Math.round(performance.now() - loginStartedAt) + ' ms');
        console.info('[Oliv Films] Tempo de consulta do perfil:', Math.round(performance.now() - profileStartedAt) + ' ms');
        if (error) {
          console.error('[Oliv Films] Falha ao consultar perfil:', error);
          throw error;
        }
        console.info('[Oliv Films] Login: perfil carregado.');
        const user = profileToUser(profile);
        if (user.status !== 'APROVADO') {
          console.warn('[Oliv Films] Encerrando sessão: perfil não aprovado. Status:', user.status, 'Origem:', source);
          await supabaseClient.auth.signOut();
          state.currentUser = user;
          state.isAuthenticated = false;
          state.authScreenMode = 'PENDING_HOLD';
          renderApp();
          return;
        }
        state.currentUser = user;
        console.info('[Oliv Films] Login: carregando dados operacionais...');
        await loadCloudData(profile);
        console.info('[Oliv Films] Login: dados carregados.');
        state.isAuthenticated = true;
        state.authError = '';
        subscribeToOwnProfile(sessionUser.id);
        subscribeToOperationalData();
        renderApp();
        console.info('[Oliv Films] Tempo total até abrir o painel:', Math.round(performance.now() - loginStartedAt) + ' ms');
        notify('Sessão segura iniciada. Dados sincronizados com a nuvem.', 'success');
      } catch (error) {
        console.error('[Oliv Films] Erro ao carregar conta/dados:', {
          message: error?.message, code: error?.code, details: error?.details, hint: error?.hint
        });
        console.warn('[Oliv Films] Encerrando sessão após falha no carregamento. Origem:', source);
        await supabaseClient.auth.signOut();
        state.isAuthenticated = false;
        state.authError = error?.message || 'Não foi possível carregar os dados da conta.';
        renderApp();
      }
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function notify(message, type = 'success') {
      let existing = document.getElementById('oliv-toast-box');
      if (existing) existing.remove();

      const borderClass =
        type === 'error'
          ? 'border-[#C8102E]'
          : type === 'info'
          ? 'border-[#C0C0C0]'
          : 'border-emerald-500';
      const iconColor =
        type === 'error'
          ? 'text-[#C8102E]'
          : type === 'info'
          ? 'text-[#C0C0C0]'
          : 'text-emerald-400';

      const div = document.createElement('div');
      div.id = 'oliv-toast-box';
      div.className = `fixed bottom-20 lg:bottom-5 right-3 left-3 sm:left-auto sm:right-5 z-[90] bg-[#181818] border-2 ${borderClass} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-fadeIn`;
      div.innerHTML = `<span class="w-2.5 h-2.5 rounded-full shrink-0 ${iconColor} bg-current"></span><span class="text-xs font-semibold">${escapeHtml(message)}</span>`;
      document.body.appendChild(div);

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        const el = document.getElementById('oliv-toast-box');
        if (el) el.remove();

      const activeUnits = state.units.filter((u) => u.status !== 'DESATIVADO');

      const accessories = activeUnits.filter((u) =>
        ['Acessórios', 'Cabos e conexões', 'Energia e baterias', 'Armazenamento'].includes(u.category)
      ).length;
      const available = activeUnits.filter((u) => u.status === 'DISPONÍVEL').length;

      const maintenance = activeUnits.filter((u) => u.status === 'EM MANUTENÇÃO' || u.status === 'AVARIADO').length;
      const overdue = activeUnits.filter((u) => isUnitOverdue(u)).length;
      const pendingUsers = state.users.filter((u) => u.status === 'PENDENTE').length;
      return { total, accessories, available, inUse, maintenance, overdue, pendingUsers };

    function generateUniquePatrimonialCode(categoryName) {
      const catObj = state.categories.find((c) => c.name === categoryName);
      const catPrefix = catObj ? catObj.prefix : 'EQP';
      const rootPrefix = `${state.companySettings.codePrefix || 'OLF'}-${catPrefix}-`;
      const existingNums = state.units
        .filter((u) => u.code && u.code.startsWith(rootPrefix))
        .map((u) => {
          const parts = u.code.split('-');
          const num = parseInt(parts[parts.length - 1], 10);
          return isNaN(num) ? 0 : num;
        });
      let nextNum = existingNums.length > 0 ? Math.max(...existingNums) + 1 : 1;
      let candidate = `${rootPrefix}${String(nextNum).padStart(6, '0')}`;
      while (state.units.some((u) => u.code === candidate)) {
        nextNum++;
        candidate = `${rootPrefix}${String(nextNum).padStart(6, '0')}`;
      }
      return candidate;
    }

    function findUnitByScannedValue(rawInput) {
      if (!rawInput) return null;
      const raw = String(rawInput).trim();
      if (!raw) return null;
      const clean = raw.toUpperCase();

      let found = state.units.find(
        (u) =>
          (u.code && u.code.toUpperCase() === clean) ||
          (u.serialNumber && u.serialNumber.toUpperCase() === clean) ||
          (u.id && u.id.toUpperCase() === clean)
      );
      if (found) return found;

      const patternMatch = clean.match(/[A-Z]{2,4}-[A-Z]{3}-\d{4,6}/);
      if (patternMatch) {
        found = state.units.find((u) => u.code && u.code.toUpperCase() === patternMatch[0]);
        if (found) return found;
      }

      found = state.units.find(
        (u) =>
          (u.code && clean.includes(u.code.toUpperCase())) ||
          (u.serialNumber && clean.includes(u.serialNumber.toUpperCase()))
      );
      if (found) return found;

      if (/^\d{1,6}$/.test(clean)) {
        const padded = clean.padStart(6, '0');
        found = state.units.find((u) => u.code && u.code.toUpperCase().endsWith(`-${padded}`));
        if (found) return found;
      }

      return state.units.find(
        (u) =>
          (u.code && u.code.toUpperCase().includes(clean)) ||
          (u.serialNumber && u.serialNumber.toUpperCase().includes(clean)) ||
          (u.model && u.model.toUpperCase().includes(clean)) ||
          (u.name && u.name.toUpperCase().includes(clean))
      ) || null;
    }

    function playScannerBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1850, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2400, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 600;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h >= w && h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, w);
            canvas.height = Math.max(1, h);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = () => resolve(null);
          img.src = ev.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    function navigateToTab(targetTab) {
      const leavingScanner = state.activeTab === 'scanner' && targetTab !== 'scanner';
      if (leavingScanner || targetTab !== 'scanner') {
        stopLiveScannerCamera();
      }

      state.activeTab = targetTab;
      state.mobileMenuOpen = false;
      state.showNotificationsDrawer = false;
      state.showUserMenu = false;

      if (targetTab === 'scanner') {
        state.scannerCameraActive = true;
        state.scannerErrorMsg = '';
      }

      renderApp();
    }

    function startLiveDecodeLoop() {
      if (liveScanRafId) cancelAnimationFrame(liveScanRafId);

      let detector = null;
      if ('BarcodeDetector' in window) {
        try {
          detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        } catch (e) {
          detector = null;
        }
      }

      let lastFrameTime = 0;

      const scanFrame = async (now) => {
        if (!state.scannerCameraActive || state.activeTab !== 'scanner' || !liveCameraStream) {
          return;
        }

        const vid = document.getElementById('live-qr-video');
        const canvas = document.getElementById('qr-decode-canvas');

        if (vid && canvas && vid.readyState >= 2 && vid.videoWidth > 0 && now - lastFrameTime > 85) {
          lastFrameTime = now;
          const w = vid.videoWidth;
          const h = vid.videoHeight;
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(vid, 0, 0, w, h);

          let decoded = null;
          if (window.jsQR) {
            const imgData = ctx.getImageData(0, 0, w, h);
            const res = window.jsQR(imgData.data, w, h, { inversionAttempts: 'attemptBoth' });
            if (res && res.data) decoded = res.data.trim();
          }

          if (!decoded && detector) {
            try {
              const barcodes = await detector.detect(canvas);
              if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
                decoded = barcodes[0].rawValue.trim();
              }
            } catch (e) {}
          }

          if (decoded) {
            const ts = Date.now();
            if (!(liveLastDecoded.code === decoded && ts - liveLastDecoded.time < 2200)) {
              liveLastDecoded = { code: decoded, time: ts };
              processCodeScan(decoded);
            }
          }
        }

        liveScanRafId = requestAnimationFrame(scanFrame);
      };

      liveScanRafId = requestAnimationFrame(scanFrame);
    }

    async function requestAndStartMobileCamera() {
      if (liveCameraStarting || state.activeTab !== 'scanner' || !state.isAuthenticated) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        state.scannerErrorMsg = 'Acesso direto à câmera requer HTTPS ou localhost. Digite o código ou use leitor USB.';
        renderApp();
        return;
      }

      const currentSession = ++liveCameraSessionId;
      liveCameraStarting = true;
      state.scannerCameraActive = true;
      state.scannerErrorMsg = '';

      try {
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: state.scannerFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
        } catch (err1) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        // Se o usuário saiu da Central de Bipagem enquanto a câmera abria, encerra imediatamente as trilhas
        if (
          currentSession !== liveCameraSessionId ||
          !state.isAuthenticated ||
          state.activeTab !== 'scanner' ||
          !state.scannerCameraActive
        ) {
          stream.getTracks().forEach((t) => t.stop());
          if (currentSession === liveCameraSessionId) liveCameraStarting = false;
          return;
        }

        liveCameraStream = stream;
        liveCameraStarting = false;
        attachStreamToVideoElement();
      } catch (err) {
        if (currentSession !== liveCameraSessionId) return;
        liveCameraStarting = false;
        state.scannerCameraActive = false;
        state.scannerErrorMsg = 'Permissão de câmera negada ou indisponível. Toque para tentar novamente.';
        if (state.activeTab === 'scanner') renderApp();
      }
    }

    function attachStreamToVideoElement() {
      const vid = document.getElementById('live-qr-video');
      if (!vid || !liveCameraStream) return;
      if (vid.srcObject !== liveCameraStream) {
        vid.srcObject = liveCameraStream;
      }
      vid.setAttribute('playsinline', 'true');
      vid.setAttribute('webkit-playsinline', 'true');
      vid.muted = true;
      vid.play().then(() => {
        vid.classList.remove('opacity-0');
        vid.classList.add('opacity-90');
        startLiveDecodeLoop();
      }).catch(() => {
        vid.classList.remove('opacity-0');
        vid.classList.add('opacity-90');
        startLiveDecodeLoop();
      });
    }

    function syncLiveScannerCamera() {
      if (state.isAuthenticated && state.activeTab === 'scanner' && state.scannerCameraActive) {
        const isStreamAlive =
          liveCameraStream &&
          liveCameraStream.getVideoTracks().some((t) => t.readyState === 'live');

        if (isStreamAlive) {
          attachStreamToVideoElement();
        } else {
          if (liveCameraStream) {
            liveCameraStream.getTracks().forEach((t) => {
              try { t.stop(); } catch (e) {}
            });
            liveCameraStream = null;
          }
          if (!liveCameraStarting && !state.scannerErrorMsg) {
            requestAndStartMobileCamera();
          }
        }
      } else {
        if (liveCameraStream || liveCameraStarting || liveScanRafId) {
          stopLiveScannerCamera();
        }
      }
    }

    function decodeQRFromNativeCameraFile(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.getElementById('qr-decode-canvas');
          if (!canvas) return;
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          if (window.jsQR) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const res = window.jsQR(imgData.data, canvas.width, canvas.height, { inversionAttempts: 'attemptBoth' });
            if (res && res.data) {
              processCodeScan(res.data);
              return;
            }
          }
          notify('Nenhum QR Code legível encontrado na foto capturada.', 'error');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function processCodeScan(rawCode) {
      const clean = String(rawCode || '').trim();
      if (!clean) {
        notify('Digite ou escaneie o código do equipamento.', 'error');
        return;
      }

      const found = findUnitByScannedValue(clean);
      if (!found) {
        notify(`Equipamento "${clean.toUpperCase()}" não encontrado no acervo Oliv Films.`, 'error');
        return;
      }

      playScannerBeep();
      state.scannedUnitId = found.id;
      if (found.status === 'DISPONÍVEL') {
        state.scannerActiveOp = 'CHECKOUT';
        notify(`${found.code} identificado — Disponível para Retirada!`, 'success');
      } else if (found.status === 'RETIRADO') {
        state.scannerActiveOp = 'RETURN';
        state.scannerReturnedBy = found.currentHolder || '';
        notify(`${found.code} identificado — Pronto para Devolução ao Estoque!`, 'info');
      } else {
        state.scannerActiveOp = null;
        notify(`${found.code} identificado — Status atual: ${found.status}.`, 'info');
      }

      renderApp();
      setTimeout(() => {
        const card = document.getElementById('scanned-result-card');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    function getFilteredInventoryUnits() {
      return state.units.filter((u) => {
        if (state.invCatFilter !== 'TODAS' && u.category !== state.invCatFilter) return false;
        if (state.invStatusFilter !== 'TODOS' && u.status !== state.invStatusFilter) return false;
        if (state.invLocFilter !== 'TODAS' && u.location !== state.invLocFilter) return false;
        if (state.globalSearch.trim()) {
          const q = state.globalSearch.trim().toLowerCase();
          const hay = `${u.code} ${u.name} ${u.brand} ${u.model} ${u.serialNumber} ${u.currentHolder || ''}`.toLowerCase();
          return hay.includes(q);
        }
        return true;
      });
    }

              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#C8102E]/20 border border-[#C8102E] flex items-center justify-center">
                  <i data-lucide="qr-code" class="w-5 h-5 text-[#C8102E]"></i>
                </div>
                <div>
                  <h2 class="text-base font-bold text-white uppercase tracking-wider">Central de Bipagem</h2>
                  <p class="text-xs text-white/50">Aponte o QR Code do equipamento para a câmera para reconhecimento imediato</p>
                </div>
              </div>

              <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-[11px] font-bold uppercase tracking-wider">

            ${state.scannerErrorMsg ? `
              <div data-action="retry-scanner-camera" class="p-3 rounded-xl bg-[#C0C0C0]/15 border border-[#C0C0C0] text-xs text-white flex items-center justify-between gap-2 cursor-pointer">
                <span>${escapeHtml(state.scannerErrorMsg)}</span>
                <span class="px-2.5 py-1 rounded bg-[#C0C0C0] text-black font-bold text-[10px] uppercase shrink-0">Tentar Novamente</span>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
              <div class="md:col-span-6">
                <div class="relative h-64 sm:h-60 rounded-xl bg-[#080808] border border-[#C0C0C0]/40 overflow-hidden flex flex-col items-center justify-center">

                  <button type="button" data-action="flip-scanner-camera" class="absolute top-2.5 right-2.5 z-20 px-2.5 py-1.5 rounded-lg bg-black/75 hover:bg-black border border-white/20 text-[10px] font-bold text-white uppercase tracking-wider cursor-pointer flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3 h-3 text-[#C0C0C0]"></i> Inverter Lente
                  </button>

                  <div class="relative z-10 w-44 h-44 rounded-lg border border-white/15 flex flex-col items-center justify-center p-4 pointer-events-none">
                    <div class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-[#C8102E]"></div>
                    <div class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-[#C8102E]"></div>
                    <div class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-[#C8102E]"></div>
                    <div class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-[#C8102E]"></div>
                    <div class="w-full h-0.5 bg-[#C8102E] shadow-[0_0_12px_#C8102E] laser-line"></div>
                    <span id="live-qr-status" class="mt-auto px-2.5 py-1 rounded bg-black/80 text-[10px] font-mono uppercase tracking-wider text-center text-[#C0C0C0]">

                    </span>
                  </div>
                </div>
              </div>

              <div class="md:col-span-6 space-y-3">
                <form id="manual-scan-form" class="space-y-2">

                  <div class="flex gap-2">
                    <input id="manual-scan-input" type="text" placeholder="Ex: OLF-CAM-000001 ou FX3" class="flex-1 bg-[#080808] border border-white/15 focus:border-[#C8102E] rounded-xl px-3.5 py-2.5 text-xs font-mono text-white uppercase outline-none" />
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#C8102E] hover:bg-[#a50d26] text-white font-bold text-xs uppercase cursor-pointer">Bipar</button>

                </form>

                <div class="pt-1">
                  <span class="block text-[10px] uppercase tracking-wider text-white/40 mb-1.5">Simular bipagem imediata (toque em um equipamento):</span>
                  <div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto pr-1">
                    ${state.units.map((u) => `
                      <button type="button" data-action="simulate-scan" data-code="${escapeHtml(u.code)}" class="px-2.5 py-1.5 rounded-lg font-mono text-[10px] font-bold border transition-all cursor-pointer ${
                        activeUnit && activeUnit.id === u.id
                          ? 'bg-[#C0C0C0] text-black border-[#C0C0C0]'
                          : u.status === 'DISPONÍVEL'
                          ? 'bg-[#080808] text-emerald-400 border-emerald-500/30 hover:border-emerald-400'
                          : 'bg-[#080808] text-[#C8102E] border-[#C8102E]/30 hover:border-[#C8102E]'
                      }">${escapeHtml(u.code)}</button>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 2. EQUIPAMENTO IDENTIFICADO: FOTO + DESCRIÇÃO SIMPLES + OPÇÃO DE RETIRAR OU DEVOLVER AO ESTOQUE -->
          <div id="scanned-result-card">
            ${activeUnit ? `
              <div class="bg-[#181818] border-2 border-[#C0C0C0]/70 rounded-2xl p-6 space-y-6 shadow-2xl animate-fadeIn">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                  <div class="md:col-span-5 h-56 rounded-xl overflow-hidden bg-[#080808] border border-white/15 relative">

                      ? `<img src="${activeUnit.photos[0]}" alt="${escapeHtml(activeUnit.name)}" class="w-full h-full object-cover" />`
                      : renderPlaceholderHTML(activeUnit.category, activeUnit.code)
                    }
                    <div class="absolute bottom-2 right-2 bg-black/80 px-2.5 py-1 rounded text-[10px] font-mono text-[#C0C0C0] border border-[#C0C0C0]/30">

                  </div>

                  <div class="md:col-span-7 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div class="flex items-center gap-2">
                        <span class="px-3 py-1 rounded-lg bg-[#C0C0C0] text-black font-mono text-xs font-black">${escapeHtml(activeUnit.code)}</span>
                        <span class="px-3 py-1 rounded-lg text-xs font-bold uppercase ${
                          activeUnit.status === 'DISPONÍVEL'
                            ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
                            : activeUnit.status === 'RETIRADO'
                            ? 'bg-[#C8102E]/20 text-[#C8102E] border border-[#C8102E]/40'
                            : 'bg-[#C0C0C0]/20 text-[#C0C0C0] border border-[#C0C0C0]/40'
                        }">
                          ${activeUnit.status === 'DISPONÍVEL' ? 'DISPONÍVEL NO ESTOQUE' : activeUnit.status === 'RETIRADO' ? 'RETIRADO (EM PRODUÇÃO)' : escapeHtml(activeUnit.status)}
                        </span>
                      </div>
                      <button type="button" data-action="clear-scanned-unit" class="text-xs text-white/50 hover:text-white cursor-pointer">Nova leitura</button>
                    </div>

                    <div>
                      <div class="text-[11px] uppercase tracking-wider text-[#C0C0C0] font-semibold">
                        ${escapeHtml(activeUnit.category)} • ${escapeHtml(activeUnit.brand)} ${escapeHtml(activeUnit.model)}
                      </div>
                      <h3 class="text-xl font-bold text-white mt-0.5">${escapeHtml(activeUnit.name)}</h3>
                      <p class="text-xs text-white/70 mt-1.5 leading-relaxed">${escapeHtml(activeUnit.description)}</p>
                      <div class="mt-2.5 p-2.5 rounded-lg bg-[#080808] border border-white/10 text-xs text-white/80">
                        ${activeUnit.status === 'RETIRADO'
                          ? `<strong class="text-[#C8102E]">Responsável Atual:</strong> ${escapeHtml(activeUnit.currentHolder)} • <strong class="text-[#C0C0C0]">Projeto:</strong> ${escapeHtml(activeUnit.currentProject)}`
                          : `<strong class="text-emerald-400">Localização Atual:</strong> ${escapeHtml(activeUnit.location)} • <strong class="text-[#C0C0C0]">Conservação:</strong> ${escapeHtml(activeUnit.condition)}`
                        }
                      </div>
                    </div>

                    <div class="pt-2 border-t border-white/10 space-y-2">
                      <div class="text-[11px] font-bold uppercase tracking-wider text-[#C0C0C0]">
                        ${activeUnit.status === 'DISPONÍVEL'
                          ? 'Ação Identificada: RETIRAR DO ESTOQUE'
                          : activeUnit.status === 'RETIRADO'
                          ? 'Ação Identificada: DEVOLVER AO ESTOQUE'
                          : 'Equipamento em Manutenção Técnica'}
                      </div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button type="button" ${activeUnit.status !== 'DISPONÍVEL' ? 'disabled' : ''} data-action="set-scanner-op" data-op="CHECKOUT" class="py-3.5 px-4 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all ${
                          activeUnit.status === 'DISPONÍVEL'
                            ? state.scannerActiveOp === 'CHECKOUT'
                              ? 'bg-[#C8102E] text-white shadow-[0_0_20px_rgba(200,16,46,0.5)] ring-2 ring-white/30 cursor-pointer'
                              : 'bg-[#C8102E]/20 text-[#C8102E] border border-[#C8102E] hover:bg-[#C8102E] hover:text-white cursor-pointer'
                            : 'bg-[#080808] text-white/25 border border-white/5 cursor-not-allowed'
                        }">
                          <i data-lucide="arrow-up-right" class="w-4 h-4"></i> Retirar Equipamento
                        </button>

                        <button type="button" ${activeUnit.status !== 'RETIRADO' ? 'disabled' : ''} data-action="set-scanner-op" data-op="RETURN" class="py-3.5 px-4 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all ${
                          activeUnit.status === 'RETIRADO'
                            ? state.scannerActiveOp === 'RETURN'
                              ? 'bg-emerald-500 text-black shadow-[0_0_20px_rgba(16,185,129,0.5)] ring-2 ring-white/30 cursor-pointer'
                              : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500 hover:bg-emerald-500 hover:text-black cursor-pointer'
                            : 'bg-[#080808] text-white/25 border border-white/5 cursor-not-allowed'
                        }">
                          <i data-lucide="arrow-down-left" class="w-4 h-4"></i> Devolver ao Estoque
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                ${state.scannerActiveOp === 'CHECKOUT' && activeUnit.status === 'DISPONÍVEL' ? `
                  <form id="quick-checkout-form" class="bg-[#080808] border border-[#C8102E]/50 rounded-xl p-4 space-y-3">
                    <div class="text-xs font-bold uppercase tracking-wider text-[#C8102E]">Registrar Retirada — ${escapeHtml(activeUnit.code)}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label class="block text-[10px] uppercase text-white/60 mb-1">Responsável pela Retirada *</label>
                        <input id="chk-holder" type="text" required placeholder="Ex: Lucas Mendes (DoP)" class="w-full bg-[#181818] border border-white/15 focus:border-[#C8102E] rounded-lg px-3 py-2 text-xs text-white outline-none" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase text-white/60 mb-1">Projeto / Produção *</label>
                        <input id="chk-project" type="text" required placeholder="Ex: Comercial Oliv Films" class="w-full bg-[#181818] border border-white/15 focus:border-[#C8102E] rounded-lg px-3 py-2 text-xs text-white outline-none" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase text-white/60 mb-1">Previsão de Devolução *</label>
                        <input id="chk-return-dt" type="datetime-local" required value="${escapeHtml(state.scannerExpectedReturn)}" class="w-full bg-[#181818] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none" />
                      </div>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-[#C8102E] hover:bg-[#a50d26] text-white font-bold text-xs uppercase tracking-wider cursor-pointer">
                      Confirmar Retirada do Equipamento
                    </button>
                  </form>
                ` : ''}

                ${state.scannerActiveOp === 'RETURN' && activeUnit.status === 'RETIRADO' ? `
                  <form id="quick-return-form" class="bg-[#080808] border border-emerald-500/50 rounded-xl p-4 space-y-3">
                    <div class="text-xs font-bold uppercase tracking-wider text-emerald-400">Registrar Devolução ao Estoque — ${escapeHtml(activeUnit.code)}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label class="block text-[10px] uppercase text-white/60 mb-1">Devolvido por *</label>
                        <input id="ret-holder" type="text" required value="${escapeHtml(state.scannerReturnedBy)}" placeholder="Nome do responsável" class="w-full bg-[#181818] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase text-white/60 mb-1">Condição na Devolução *</label>
                        <select id="ret-cond" class="w-full bg-[#181818] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
                          <option value="PERFEITO">Perfeito Estado (Disponível)</option>
                          <option value="AVARIADO">Com Avarias</option>
                          <option value="MANUTENÇÃO">Necessita Manutenção</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase text-white/60 mb-1">Local de Guarda no Estoque *</label>
                        <select id="ret-loc" class="w-full bg-[#181818] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
                          ${state.locations.map((loc) => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('')}
                        </select>
                      </div>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-black font-bold text-xs uppercase tracking-wider cursor-pointer">
                      Confirmar Devolução ao Estoque
                    </button>
                  </form>
                ` : ''}
              </div>
            ` : `
              <div class="bg-[#181818]/60 border border-dashed border-white/15 rounded-2xl p-8 text-center">
                <i data-lucide="qr-code" class="w-10 h-10 text-white/25 mx-auto mb-2"></i>
                <p class="text-sm font-semibold text-white/70">Pronto para identificar o equipamento</p>
                <p class="text-xs text-white/40 mt-1">Aponte o QR Code para a câmera, digite o código ou clique em uma das etiquetas acima para visualizar a foto e escolher entre Retirar ou Devolver ao Estoque.</p>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderMaintenanceView() {
      const maintUnits = state.units.filter((u) => u.status === 'EM MANUTENÇÃO' || u.status === 'AVARIADO');
      const availUnits = state.units.filter((u) => u.status === 'DISPONÍVEL');

      return `
        <div class="space-y-6 animate-fadeIn">
          <div class="bg-[#181818] border border-[#C0C0C0]/30 rounded-xl p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-bold text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="wrench" class="w-5 h-5 text-[#C0C0C0]"></i> Controle de Manutenção Preventiva e Corretiva
              </h2>
              <p class="text-xs text-white/50">Equipamentos em manutenção ficam bloqueados para retirada</p>
            </div>

            ${isManagerOrAdmin() ? `
              <form id="open-maint-form" class="flex flex-wrap items-center gap-2">
                <select id="maint-unit-id" required class="bg-[#080808] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
                  <option value="">Enviar item para manutenção...</option>
                  ${availUnits.map((u) => `<option value="${u.id}">${escapeHtml(u.code)} — ${escapeHtml(u.name)}</option>`).join('')}
                </select>
                <input id="maint-reason" type="text" required placeholder="Motivo / Defeito constatado..." class="bg-[#080808] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none" />
                <button type="submit" class="px-4 py-2 rounded-lg bg-[#C0C0C0] text-black font-bold text-xs uppercase cursor-pointer">Abrir O.S.</button>
              </form>
            ` : `
              <div class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-[#080808] border border-[#C0C0C0]/30 text-xs text-[#C0C0C0]">
                <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                <span>Abertura e baixa técnica exclusivas para Administradores e Gerentes</span>
              </div>
            `}
          </div>

          ${maintUnits.length === 0 ? `
            <div class="bg-[#181818] border border-white/10 rounded-xl p-12 text-center">
              <i data-lucide="check-circle-2" class="w-10 h-10 text-emerald-400 mx-auto mb-2"></i>
              <div class="text-sm font-bold text-white">Nenhum Equipamento em Manutenção</div>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${maintUnits.map((u) => `
                <div class="bg-[#181818] border border-[#C0C0C0]/40 rounded-xl p-5 flex flex-col justify-between gap-4">
                  <div class="space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="font-mono text-xs font-bold text-[#C0C0C0]">${escapeHtml(u.code)}</span>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#C8102E]/20 text-[#C8102E]">${escapeHtml(u.status)}</span>
                    </div>
                    <h3 class="text-base font-bold text-white">${escapeHtml(u.name)}</h3>
                    <div class="p-3 rounded-lg bg-[#080808] border border-white/10 text-xs text-white/80">
                      <strong class="text-[#C0C0C0]">Diagnóstico:</strong> ${escapeHtml(u.notes || 'Em revisão no laboratório.')}
                    </div>
                  </div>
                  <div class="flex items-center justify-between pt-3 border-t border-white/10">
                    <button type="button" data-action="open-unit-detail" data-id="${u.id}" class="text-xs text-white/60 hover:text-white underline cursor-pointer">Ver Ficha</button>
                    ${isManagerOrAdmin() ? `
                      <button type="button" data-action="release-maint" data-id="${u.id}" class="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-black font-bold text-xs uppercase cursor-pointer">
                        Concluir Reparo e Liberar
                      </button>
                    ` : `<span class="text-[11px] text-white/40">Restrito à Gerência</span>`}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderHistoryView() {
      const filtered = state.movements.filter((m) => {
        if (state.historyTypeFilter !== 'TODOS' && m.type !== state.historyTypeFilter) return false;
        if (state.historySearch.trim()) {
          const hay = `${m.unitCode} ${m.unitName} ${m.holderName} ${m.project} ${m.authorizedBy}`.toLowerCase();
          return hay.includes(state.historySearch.trim().toLowerCase());
        }
        return true;
      });

      return `
        <div class="space-y-5 animate-fadeIn">
          <div class="bg-[#181818] border border-white/10 rounded-xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-bold text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="history" class="w-5 h-5 text-[#C0C0C0]"></i> Histórico Permanente de Movimentações & Auditoria
              </h2>
              <p class="text-xs text-white/50">Rastreabilidade completa de retiradas, devoluções, cadastros e manutenções</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input id="hist-search-input" type="text" value="${escapeHtml(state.historySearch)}" placeholder="Buscar código, responsável..." class="bg-[#080808] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none" />
              <select id="hist-type-select" class="bg-[#080808] border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
                <option value="TODOS" ${state.historyTypeFilter === 'TODOS' ? 'selected' : ''}>Todas (${state.movements.length})</option>
                <option value="RETIRADA" ${state.historyTypeFilter === 'RETIRADA' ? 'selected' : ''}>Retiradas</option>
                <option value="DEVOLUÇÃO" ${state.historyTypeFilter === 'DEVOLUÇÃO' ? 'selected' : ''}>Devoluções</option>
                <option value="CADASTRO" ${state.historyTypeFilter === 'CADASTRO' ? 'selected' : ''}>Cadastros</option>
                <option value="MANUTENÇÃO" ${state.historyTypeFilter === 'MANUTENÇÃO' ? 'selected' : ''}>Manutenções</option>
              </select>
            </div>
          </div>

          <div class="bg-[#181818] border border-white/10 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-[#080808] border-b border-white/10 text-[11px] uppercase tracking-wider text-[#C0C0C0]">
                    <th class="py-3.5 px-4">Data / Hora</th>
                    <th class="py-3.5 px-4">Operação</th>
                    <th class="py-3.5 px-4">Código / Unidade</th>
                    <th class="py-3.5 px-4">Responsável / Destino</th>
                    <th class="py-3.5 px-4">Projeto / Finalidade</th>
                    <th class="py-3.5 px-4">Autorizado por</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                  ${filtered.map((log) => `
                    <tr class="hover:bg-white/[0.02]">
                      <td class="py-3 px-4 font-mono text-[11px] text-white/60 whitespace-nowrap">${new Date(log.timestamp).toLocaleString('pt-BR')}</td>
                      <td class="py-3 px-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                          log.type === 'RETIRADA'
                            ? 'bg-[#C8102E]/20 text-[#C8102E]'
                            : log.type === 'DEVOLUÇÃO'
                            ? 'bg-emerald-500/20 text-emerald-400'
                            : 'bg-[#C0C0C0]/20 text-[#C0C0C0]'
                        }">${escapeHtml(log.type)}</span>
                      </td>
                      <td class="py-3 px-4">
                        <div class="font-mono font-bold text-[#C0C0C0]">${escapeHtml(log.unitCode)}</div>
                        <div class="text-white/80">${escapeHtml(log.unitName)}</div>
                      </td>
                      <td class="py-3 px-4 text-white font-medium">${escapeHtml(log.holderName)}</td>
                      <td class="py-3 px-4">
                        <div class="text-white/90">${escapeHtml(log.project)}</div>
                        <div class="text-[11px] text-white/50">${escapeHtml(log.purpose)}</div>
                      </td>
                      <td class="py-3 px-4 text-white/70">${escapeHtml(log.authorizedBy)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function getReportRows() {
      switch (state.selectedReport) {

        case 'ATRASADOS': return state.units.filter((u) => isUnitOverdue(u));
        case 'MANUTENCAO': return state.units.filter((u) => u.status === 'EM MANUTENÇÃO' || u.status === 'AVARIADO');

                <div class="border-t border-white/10 pt-4 space-y-2">
                  <h4 class="text-xs font-bold uppercase tracking-wider text-[#C0C0C0]">Linha do Tempo Individual (${unitHistory.length})</h4>
                  <div class="max-h-36 overflow-y-auto space-y-1.5 pr-1">
                    ${unitHistory.map((h) => `
                      <div class="p-2.5 rounded-lg bg-[#080808] border border-white/10 flex items-center justify-between text-xs">
                        <div><span class="font-bold text-[#C0C0C0]">${escapeHtml(h.type)}</span> — ${escapeHtml(h.holderName)} (${escapeHtml(h.project)})</div>

      }

      // 2. Modal de Impressão de Etiquetas QR Code / Relatórios PDF
      if (state.printableDocument) {
        const docData = state.printableDocument;
        const items = docData.type === 'SINGLE_LABEL' ? [docData.unit] : docData.type === 'BATCH_LABELS' ? (docData.units || []) : [];

        html += `

                    <div class="border-b-2 border-black pb-2 flex items-center justify-between">
                      <div>
                        <div class="font-black text-lg tracking-wider">OLIV FILMS</div>

                      <tbody class="divide-y divide-neutral-300">
                        ${(docData.rows || []).map((r) => `
                          <tr>
                            <td class="py-1.5 font-mono font-bold">${escapeHtml(r.code)}</td>
                            <td class="py-1.5">${escapeHtml(r.name)}</td>
                            <td class="py-1.5 font-mono">${escapeHtml(r.serialNumber)}</td>
                            <td class="py-1.5">${escapeHtml(r.status)}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                ` : `
                  <div class="labels-grid grid gap-4 ${
                    state.labelLayout === 'THERMAL_60X40' || items.length === 1
                      ? 'grid-cols-1 max-w-xs mx-auto'
                      : 'grid-cols-1 sm:grid-cols-2 md:grid-cols-3'

                    ${items.map((u) => `
                      <div class="label-card bg-white text-black p-4 rounded-xl border-2 border-black flex flex-col items-center text-center space-y-1.5">
                        <div class="brand-title text-[11px] font-black tracking-[0.2em] uppercase text-black">OLIV FILMS</div>
                        ${renderQRCodeSVG(u.code, buildEquipmentQRPayload(u.code, state.companySettings), 112, false)}

      // 3. Modal de Diretório Público de Achados e Perdidos
      if (state.lostFoundUnit) {

                <p class="text-xs text-white/70 leading-relaxed">${escapeHtml(state.companySettings.lostFoundMessage)}</p>
              </div>

              <div class="bg-[#080808] border border-white/15 rounded-xl p-4 text-left flex items-center gap-4">

                  ${unit.photos && unit.photos.length > 0
                    ? `<img src="${unit.photos[0]}" alt="Foto de ${escapeHtml(unit.name)}" class="w-full h-full object-contain p-1" />`
