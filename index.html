                </div>
                <div class="min-w-0">
                  <span class="px-2 py-0.5 rounded bg-[#C0C0C0] text-black font-mono text-[11px] font-black">${escapeHtml(unit.code)}</span>
                  <h3 class="text-sm font-bold text-white truncate mt-1">${escapeHtml(unit.name)}</h3>
                  <p class="text-[11px] text-white/50 font-mono truncate">S/N: ${escapeHtml(unit.serialNumber || 'Registrado no Cofre')}</p>
                </div>
              </div>

              <div class="bg-[#080808] border border-[#C0C0C0]/30 rounded-xl p-4 text-left space-y-2 text-xs">
                <div class="text-[10px] font-bold uppercase tracking-wider text-[#C0C0C0]">Dados de Contato para Devolução Imediata:</div>
                <div class="text-white"><strong class="text-white/60">Responsável:</strong> ${escapeHtml(state.companySettings.ownerContactName)}</div>
                <div class="text-white"><strong class="text-white/60">Telefone / WhatsApp:</strong> <span class="font-mono text-emerald-400 font-bold">${escapeHtml(state.companySettings.ownerPhoneDisplay)}</span></div>
                <div class="text-white"><strong class="text-white/60">E-mail:</strong> ${escapeHtml(state.companySettings.ownerEmail)}</div>
                <div class="text-white"><strong class="text-white/60">Base de Entrega:</strong> ${escapeHtml(state.companySettings.ownerAddress)}</div>
              </div>

              <div class="space-y-2.5 pt-1">
                <a href="${whatsappHref}" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-black font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg">
                  <i data-lucide="arrow-up-right" class="w-4 h-4"></i> Falar Agora no WhatsApp do Proprietário
                </a>
                <div class="grid grid-cols-2 gap-2">
                  <a href="tel:+${rawPhone}" class="py-2.5 px-3 rounded-xl bg-[#080808] hover:bg-white/10 border border-white/15 text-xs font-bold text-white flex items-center justify-center">
                    Ligar para ${escapeHtml(state.companySettings.ownerPhoneDisplay)}
                  </a>
                  <a href="${mailHref}" class="py-2.5 px-3 rounded-xl bg-[#080808] hover:bg-white/10 border border-white/15 text-xs font-bold text-[#C0C0C0] flex items-center justify-center gap-1.5">
                    Enviar E-mail

              </div>
            </div>
          </div>

      return html;
    }

    // =========================================================================

    // =========================================================================
    function dismissBootScreen() {
      const bootScreen = document.getElementById('oliv-boot-screen');
      if (!bootScreen || bootScreen.classList.contains('is-leaving')) return;
      bootScreen.classList.add('is-leaving');
      window.setTimeout(() => bootScreen.remove(), 320);
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;
      dismissBootScreen();

      if (!state.isAuthenticated || !state.currentUser || state.currentUser.status !== 'APROVADO') {
        stopLiveScannerCamera();
        root.innerHTML = renderAuthScreen() + renderModals();
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      const metrics = computeMetrics();
      const alerts = computeAlerts();

      const navItems = [
        { id: 'dashboard', label: '1. Dashboard', icon: 'bar-chart-3' },
        { id: 'inventory', label: '2. Inventário', icon: 'layers', badge: metrics.total },
        { id: 'register', label: '3. Cadastrar Equipamento', icon: 'plus', restricted: !isManagerOrAdmin() },
        { id: 'categories', label: '4. Categorias', icon: 'grid' },
        { id: 'scanner', label: '5. Central de Bipagem', icon: 'qr-code', highlight: true, badge: metrics.inUse },
        { id: 'maintenance', label: '6. Em Manutenção', icon: 'wrench', badge: metrics.maintenance },
        { id: 'history', label: '7. Histórico & Auditoria', icon: 'history' },
        { id: 'reports', label: '8. Relatórios (PDF/Excel)', icon: 'file-text' },
        { id: 'users', label: '9. Usuários', icon: 'users', badge: metrics.pendingUsers, restricted: !isAdmin() },
        { id: 'settings', label: '10. Configurações', icon: 'settings', restricted: !isManagerOrAdmin() }
      ];

      let mainContentHTML = '';
      switch (state.activeTab) {
        case 'inventory': mainContentHTML = renderInventoryView(); break;
        case 'register': mainContentHTML = renderRegistrationView(); break;
        case 'categories': mainContentHTML = renderCategoriesView(); break;
        case 'scanner': mainContentHTML = renderScannerHubView(); break;
        case 'maintenance': mainContentHTML = renderMaintenanceView(); break;
        case 'history': mainContentHTML = renderHistoryView(); break;
        case 'reports': mainContentHTML = renderReportsView(); break;
        case 'users': mainContentHTML = renderUsersView(); break;
        case 'settings': mainContentHTML = renderSettingsView(); break;
        default: mainContentHTML = renderDashboardView(metrics); break;
      }

      root.innerHTML = `
        <div class="min-h-screen bg-[#080808] text-[#F5F5F5] flex flex-col lg:flex-row font-sans pb-20 lg:pb-0">

                ${renderOlivFilmsLogo('md', 'w-full')}
                <div class="text-[9px] font-mono tracking-[0.22em] text-[#C0C0C0] uppercase">CONTROLE PATRIMONIAL</div>

                  const isActive = state.activeTab === item.id;
                  return `
                    <button type="button" data-action="switch-tab" data-tab="${item.id}" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all cursor-pointer ${
                      isActive
                        ? 'bg-[#C8102E] text-white shadow-[0_0_18px_rgba(200,16,46,0.4)]'
                        : item.highlight
                        ? 'bg-[#080808] text-[#C0C0C0] border border-[#C0C0C0]/30 hover:border-[#C0C0C0]'
                        : 'text-white/70 hover:bg-white/5 hover:text-white'

                      <div class="flex items-center gap-2.5 truncate">

                        <span class="truncate">${escapeHtml(item.label)}</span>
                      </div>
                      ${item.restricted
                        ? `<i data-lucide="lock" class="w-3.5 h-3.5 text-white/40 shrink-0"></i>`

                      }

            <div class="p-4 border-t border-white/10 bg-[#080808]/80 space-y-3">

          ${state.mobileMenuOpen ? `

              <div class="relative w-72 max-w-[85vw] bg-[#181818] border-r border-[#C0C0C0]/40 h-full flex flex-col justify-between z-10 overflow-y-auto shadow-2xl">

                  <div class="p-4 border-b border-white/10 flex items-center justify-between gap-2">

                      return `

                          isActive ? 'bg-[#C8102E] text-white' : 'text-white/80 hover:bg-white/5'
                        }">
                          <div class="flex items-center gap-3 truncate">
                            <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${isActive ? 'text-white' : 'text-[#C0C0C0]'}"></i>
                            <span class="truncate">${escapeHtml(item.label)}</span>
                          </div>
                        </button>
                      `;
                    }).join('')}
                  </nav>
                </div>
                <div class="p-4 border-t border-white/10 bg-[#080808] grid grid-cols-2 gap-2">
                  <button type="button" data-action="switch-user" class="py-2.5 px-3 rounded-xl bg-[#181818] border border-white/15 text-xs font-semibold text-[#C0C0C0] cursor-pointer">Trocar</button>
                  <button type="button" data-action="logout" class="py-2.5 px-3 rounded-xl bg-[#C8102E] text-xs font-bold text-white cursor-pointer">Sair</button>
                </div>

          ` : ''}

          <!-- CONTEÚDO PRINCIPAL -->
          <div class="flex-1 flex flex-col min-w-0">

                <input id="global-search-input" type="text" value="${escapeHtml(state.globalSearch)}" placeholder="Buscar código OLF, câmera, lente, série..." class="w-full bg-[#080808] border border-white/15 focus:border-[#C0C0C0] rounded-xl pl-10 pr-4 py-2 text-xs text-white outline-none" />
              </div>

              <div class="flex items-center gap-2 sm:gap-3">
                <button type="button" data-action="switch-tab" data-tab="scanner" title="Central de Bipagem QR Code" aria-label="Central de Bipagem QR Code" class="p-2.5 rounded-xl bg-[#080808] hover:bg-[#C8102E] border border-[#C8102E] text-white transition-all cursor-pointer flex items-center justify-center group">

                    ${alerts.length > 0 ? `<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#C8102E] text-white text-[10px] font-bold flex items-center justify-center">${alerts.length}</span>` : ''}

    function executeCleanPrint() {
      const printArea = document.getElementById('oliv-printable-area');
      if (!printArea) {
        window.print();
        return;
      }

      const isThermal = state.labelLayout === 'THERMAL_60X40' && state.printableDocument?.type !== 'REPORT_PDF';
      const itemsCount = state.printableDocument?.type === 'SINGLE_LABEL' ? 1 : (state.printableDocument?.units?.length || 1);

      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = '0';
      document.body.appendChild(iframe);

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8" />
            <title>OLIV FILMS — Impressão</title>
            <style>
              @page { size: ${isThermal ? '60mm 40mm' : 'A4'}; margin: ${isThermal ? '2mm' : '10mm'}; }
              * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
              body { margin: 0; padding: 0; background: #FFF; color: #000; font-family: Arial, sans-serif; }
              .labels-grid { display: grid; grid-template-columns: ${isThermal ? '1fr' : itemsCount === 1 ? '240px' : 'repeat(3, 1fr)'}; gap: 10px; }
              .label-card { border: 2px solid #000; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; page-break-inside: avoid; }
              .brand-title { font-size: 11px; font-weight: 900; letter-spacing: 2px; margin-bottom: 4px; }
              .unit-code { font-family: monospace; font-size: 12px; font-weight: 900; margin-top: 4px; }
              .unit-name { font-size: 10px; font-weight: 700; margin-top: 3px; }
              .unit-sn { font-family: monospace; font-size: 9px; margin-top: 2px; }
              table { width: 100%; border-collapse: collapse; font-size: 11px; }
              th, td { border-bottom: 1px solid #000; padding: 6px; text-align: left; }
            </style>
          </head>
          <body>${printArea.innerHTML}</body>
        </html>
      `);
      doc.close();

      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => {
          if (document.body.contains(iframe)) document.body.removeChild(iframe);
        }, 1500);
      }, 250);
    }

    function downloadLabelsPNG() {
      const docData = state.printableDocument;
      if (!docData) return;
      const items = docData.type === 'SINGLE_LABEL' ? [docData.unit] : (docData.units || []);
      if (items.length === 0) return;

      const cols = items.length === 1 ? 1 : Math.min(3, items.length);
      const rows = Math.ceil(items.length / cols);
      const cardW = 320;
      const cardH = 340;
      const pad = 20;

      const canvas = document.createElement('canvas');
      canvas.width = cols * cardW + (cols + 1) * pad;
      canvas.height = rows * cardH + (rows + 1) * pad;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      items.forEach((u, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const x = pad + col * (cardW + pad);
        const y = pad + row * (cardH + pad);

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y, cardW, cardH);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.strokeRect(x, y, cardW, cardH);

        ctx.fillStyle = '#000000';
        ctx.font = '900 16px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('OLIV FILMS', x + cardW / 2, y + 28);

        const qrPayload = buildEquipmentQRPayload(u.code, state.companySettings);
        const { modules, size: gridSize } = encodeRealQRMatrix(qrPayload);
        const quietZone = 2;
        const totalModules = gridSize + quietZone * 2;
        const qrBoxSize = 176;
        const cell = qrBoxSize / totalModules;
        const qrStartX = x + (cardW - qrBoxSize) / 2;
        const qrStartY = y + 40;

        ctx.fillStyle = '#000000';
        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            if (modules[r][c] === 1) {
              ctx.fillRect(
                Math.round(qrStartX + (c + quietZone) * cell),
                Math.round(qrStartY + (r + quietZone) * cell),
                Math.ceil(cell),
                Math.ceil(cell)
              );
            }
          }
        }

        ctx.font = 'bold 16px monospace';
        ctx.fillText(u.code, x + cardW / 2, y + 240);

        ctx.font = 'bold 12px Arial, sans-serif';
        const cleanName = (u.name || '').length > 30 ? `${u.name.slice(0, 28)}...` : (u.name || '');
        ctx.fillText(cleanName, x + cardW / 2, y + 264);

        ctx.font = '11px monospace';
        ctx.fillStyle = '#333333';
        ctx.fillText(`S/N: ${u.serialNumber || '-'}`, x + cardW / 2, y + 286);

        ctx.font = 'bold 10px Arial, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText(`ACHOU? ESCANEIE OU LIGUE: ${state.companySettings.ownerPhoneDisplay || '(71) 99999-9999'}`, x + cardW / 2, y + 314);
      });

      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = items.length === 1 ? `ETIQUETA_${items[0].code}.png` : `ETIQUETAS_OLIV_FILMS_${items.length}_ITENS.png`;
      a.click();
      notify('Etiqueta(s) baixada(s) em alta resolução (.PNG)!', 'success');
    }

    function exportReportToCSV() {
      const rows = getReportRows();
      const headers = ['Codigo_Patrimonial', 'Equipamento', 'Marca', 'Modelo', 'Numero_Serie', 'Categoria', 'Status', 'Conservacao', 'Localizacao_ou_Responsavel'];
      const lines = rows.map((u) => [
        u.code,
        `"${(u.name || '').replace(/"/g, '""')}"`,
        u.brand,
        u.model,
        u.serialNumber,
        u.category,
        u.status,
        u.condition,
        `"${u.status === 'RETIRADO' ? u.currentHolder : u.location}"`
      ].join(';'));

      const csvContent = '\uFEFF' + [headers.join(';'), ...lines].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `OLIV_FILMS_${state.selectedReport}_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      notify('Planilha Excel (.CSV) exportada com sucesso!', 'success');
    }

      const btn = e.target.closest('[data-action]');

      switch (action) {
        case 'auth-mode':

          state.authError = '';
          renderApp();
          break;

        case 'recover-send': {
          const recoveryInput = document.querySelector('input[placeholder="E-mail cadastrado"]');
          const recoveryEmail = (recoveryInput?.value || state.authEmail || '').trim().toLowerCase();
          if (!recoveryEmail) {
            state.authError = 'Informe o e-mail cadastrado.';
            renderApp();
            break;
          }
          requestCloudPasswordReset(recoveryEmail).catch(error => {
            state.authError = error.message || 'Falha ao solicitar recuperação.';
            renderApp();
          });
          break;
        }

        case 'switch-user':
          handleSwitchUser();
          break;

        case 'logout':
          handleLogout('Sessão encerrada com segurança.');
          break;

        case 'switch-tab': {
          const targetTab = btn.getAttribute('data-tab');
          navigateToTab(targetTab);
          break;
        }

        case 'inv-view-mode':
          state.inventoryViewMode = btn.getAttribute('data-mode');
          renderApp();
          break;

        case 'edit-unit': {
          if (!checkPermission(['ADMIN', 'GERENCIADOR'])) break;
          const unit=state.units.find(u=>u.id===btn.getAttribute('data-id')); if(!unit) break;
          state.regEditUnitId=unit.id; state.regName=unit.name||''; state.regBrandModel=`${unit.brand||''} ${unit.model||''}`.trim();
          state.regCategory=unit.category||state.categories[0]?.name||'Câmeras'; state.regSerialNumber=unit.serialNumber||'';
          state.regLocation=unit.location||state.locations[0]; state.regCondition=unit.condition||'Perfeito'; state.regDescription=unit.description||'';
          state.regAccessories=Array.isArray(unit.accessories)?unit.accessories.map(item=>({...item})):[]; state.regPhotos=Array.isArray(unit.photos)?[...unit.photos]:[];
          state.selectedUnitDetailId=null; state.activeTab='register'; renderApp(); break;
        }
        case 'delete-unit': {
          if (!checkPermission(['ADMIN', 'GERENCIADOR'])) break;
          const unit=state.units.find(u=>u.id===btn.getAttribute('data-id')); if(!unit) break;
          if(unit.status==='RETIRADO'){notify('Devolva o equipamento ao estoque antes de excluí-lo.','error');break;}
          if(!window.confirm(`Tem certeza que deseja excluir ${unit.code} — ${unit.name}? O histórico de movimentações será preservado.`)) break;
          state.units=state.units.filter(u=>u.id!==unit.id); if(state.scannedUnitId===unit.id)state.scannedUnitId=null;
          if(state.selectedUnitDetailId===unit.id)state.selectedUnitDetailId=null; persistState(); renderApp(); notify(`Equipamento ${unit.code} excluído do inventário.`,'success'); break;
        }
        case 'open-unit-detail':
          if (e.target.closest('[data-stop-card-open], [data-stop-row-open]')) break;
          state.selectedUnitDetailId = btn.getAttribute('data-id');
          renderApp();
          break;

        case 'close-unit-detail':
          state.selectedUnitDetailId = null;
          renderApp();
          break;

        case 'print-single-label': {
          const unit = state.units.find((u) => u.id === btn.getAttribute('data-id'));
          if (unit) {
            state.selectedUnitDetailId = null;
            state.printableDocument = { type: 'SINGLE_LABEL', unit };
            renderApp();
          }
          break;
        }

        case 'open-mobile-menu':
          state.mobileMenuOpen = true;
          renderApp();
          break;

        case 'close-mobile-menu':
          state.mobileMenuOpen = false;
          renderApp();
          break;

        case 'toggle-notifications':
          state.showNotificationsDrawer = !state.showNotificationsDrawer;
          state.showUserMenu = false;
          renderApp();
          break;

        case 'toggle-user-menu':
          state.showUserMenu = !state.showUserMenu;
          state.showNotificationsDrawer = false;
          renderApp();
          break;

        case 'alert-click': {
          const tab = btn.getAttribute('data-tab');
          const uid = btn.getAttribute('data-unit');
          if (uid) state.scannedUnitId = uid;
          navigateToTab(tab);
          break;
        }

        case 'print-batch-labels':
          state.printableDocument = { type: 'BATCH_LABELS', units: getFilteredInventoryUnits() };
          renderApp();
          break;

        case 'close-printable':
          state.printableDocument = null;
          renderApp();
          break;

        case 'execute-clean-print':
          executeCleanPrint();
          break;

        case 'download-labels-png':
          downloadLabelsPNG();
          break;

        case 'quick-fill-model': {
          const mod = state.models.find((m) => m.id === btn.getAttribute('data-id'));
          if (mod) {
            state.regName = mod.name;
            state.regBrandModel = `${mod.brand} ${mod.model}`;
            state.regCategory = mod.category;
            state.regDescription = mod.description;
            renderApp();
            notify(`Modelo "${mod.name}" preenchido!`, 'info');
          }
          break;
        }

        case 'gen-auto-serial': {
          const catObj = state.categories.find((c) => c.name === state.regCategory);
          const prefix = catObj ? catObj.prefix : 'EQP';
          state.regSerialNumber = `SN-${prefix}-${Math.floor(10000 + Math.random() * 90000)}`;
          renderApp();
          break;
        }

        case 'set-reg-condition':
          state.regCondition = btn.getAttribute('data-cond');
          renderApp();
          break;

        case 'add-reg-accessory':
          state.regAccessories.push({ name: '', quantity: 1, notes: '' });
          renderApp();
          break;

        case 'remove-reg-accessory': {
          const accessoryIndex = Number(btn.getAttribute('data-index'));
          if (Number.isInteger(accessoryIndex) && accessoryIndex >= 0 && accessoryIndex < state.regAccessories.length) {
            state.regAccessories.splice(accessoryIndex, 1);
            renderApp();
          }
          break;
        }

        case 'clear-reg-photo':
          state.regPhotos = [];
          renderApp();
          break;

        case 'delete-category': {
          if (!checkPermission(['ADMIN', 'GERENCIADOR'])) break;
          const catId = btn.getAttribute('data-id');
          state.categories = state.categories.filter((c) => c.id !== catId);
          persistState();
          renderApp();
          notify('Categoria removida.', 'info');
          break;
        }

        case 'toggle-scanner-camera':
          e.stopPropagation();
          if (state.scannerCameraActive) {
            stopLiveScannerCamera();
            state.scannerCameraActive = false;
            renderApp();
          } else {
            requestAndStartMobileCamera();
          }
          break;

        case 'simulate-scan':
          processCodeScan(btn.getAttribute('data-code'));
          break;

        case 'open-unit-in-scanner':
          state.scannedUnitId = btn.getAttribute('data-id');
          state.selectedUnitDetailId = null;
          navigateToTab('scanner');
          break;

        case 'retry-scanner-camera':
          e.stopPropagation();
          state.scannerErrorMsg = '';
          state.scannerCameraActive = true;
          renderApp();
          break;

        case 'flip-scanner-camera':
          e.stopPropagation();
          state.scannerFacingMode = state.scannerFacingMode === 'environment' ? 'user' : 'environment';
          stopLiveScannerCamera();
          state.scannerCameraActive = true;
          renderApp();
          break;

        case 'clear-scanned-unit':
          state.scannedUnitId = null;
          state.scannerActiveOp = null;
          renderApp();
          break;

        case 'set-scanner-op':
          state.scannerActiveOp = btn.getAttribute('data-op');
          renderApp();
          break;

        case 'release-maint': {
          if (!checkPermission(['ADMIN', 'GERENCIADOR'])) break;
          const uid = btn.getAttribute('data-id');
          const unit = state.units.find((u) => u.id === uid);
          if (unit) {
            unit.status = 'DISPONÍVEL';
            unit.condition = 'Perfeito';
            unit.location = state.locations[0];
            state.movements.unshift({
              id: `mov-${Date.now()}`,
              type: 'ALTA TÉCNICA',
              unitId: unit.id,
              unitCode: unit.code,
              unitName: unit.name,
              holderName: state.locations[0],
              purpose: 'Retorno de Manutenção Técnica',
              project: 'Estoque Operacional',
              timestamp: new Date().toISOString(),
              authorizedBy: state.currentUser.name,
              status: 'CONCLUÍDO'
            });
            persistState();
            renderApp();
            notify(`${unit.code} liberado para o estoque!`, 'success');
          }
          break;
        }

        case 'select-report':
          state.selectedReport = btn.getAttribute('data-id');
          renderApp();
          break;

        case 'export-csv':
          exportReportToCSV();
          break;

        case 'print-report-pdf':
          state.printableDocument = {
            type: 'REPORT_PDF',
            title: `Relatório Patrimonial — ${state.selectedReport}`,
            rows: getReportRows()
          };
          renderApp();
          break;

        case 'delete-user': {
          if (!isAdmin() || !supabaseClient) break;
          const usr = state.users.find((u) => u.id === btn.getAttribute('data-id'));
          if (!usr || usr.isPrimaryAdmin || usr.id === state.currentUser?.id) {
            notify('Este usuário não pode ser excluído por aqui.', 'error');
            break;
          }
          const confirmed = window.confirm('Tem certeza que deseja excluir definitivamente o usuário ' + usr.name + ' (' + usr.email + ')? Esta ação removerá também o acesso de login e não poderá ser desfeita.');
          if (!confirmed) break;
          btn.disabled = true;
          btn.textContent = 'Excluindo...';
          const { error } = await supabaseClient.rpc('admin_delete_user', { p_user_id: usr.id });
          if (error) {
            console.error('[Oliv Films] Falha ao excluir usuário:', error);
            notify('Não foi possível excluir o usuário: ' + error.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Excluir';
            break;
          }
          state.users = state.users.filter((u) => u.id !== usr.id);
          renderApp();
          notify('Usuário ' + usr.name + ' excluído com sucesso.', 'success');
          break;
        }

        case 'change-user-status': {
          if (!isAdmin() || !supabaseClient) break;
          const usr = state.users.find((u) => u.id === btn.getAttribute('data-id'));
          if (usr && !usr.isPrimaryAdmin) {
            const nextStatus = btn.getAttribute('data-status');
            const dbStatus = nextStatus === 'APROVADO' ? 'approved' : nextStatus === 'BLOQUEADO' ? 'blocked' : 'pending';
            const { error } = await supabaseClient.from('profiles').update({ status: dbStatus }).eq('id', usr.id);
            if (error) { notify('Não foi possível alterar o status: ' + error.message, 'error'); break; }
            usr.status = nextStatus;
            renderApp();
            notify(`Status de ${usr.name} atualizado para ${usr.status}.`, 'success');
          }
          break;
        }

        case 'set-qr-link-mode':
          state.companySettings.qrLinkMode = btn.getAttribute('data-mode');
          persistState();
          renderApp();
          break;

        case 'preview-lost-found':
          state.lostFoundUnit = state.units[0];
          renderApp();
          break;

        case 'simulate-found-unit': {
          const u = state.units.find((x) => x.id === btn.getAttribute('data-id'));
          if (u) {
            state.lostFoundUnit = u;
            renderApp();
          }
          break;
        }

        case 'close-lost-found':
          state.lostFoundUnit = null;
          renderApp();
          break;
      }
    });

        renderApp();
      } else if (target.id === 'reg-eq-location') {
        state.regLocation = target.value;
      } else if (target.id === 'reg-photo-input' || target.id === 'reg-camera-input') {
        const file = target.files && target.files[0];
        if (file) {
          const compressed = await compressImageFile(file);
          if (compressed) {
            state.regPhotos = [compressed];
            renderApp();
            notify('Fotografia anexada com sucesso!', 'success');
          }
        }
      } else if (target.getAttribute('data-action') === 'load-original-logo') {
        const file = target.files && target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            state.companySettings.logoDataUrl = ev.target.result;
            persistState();
            renderApp();
            notify('Logo original Oliv_Films_simbolo_4K.jpg aplicada sem alterações!', 'success');
          };
          reader.readAsDataURL(file);
          target.value = '';
        }
      } else if (target.id === 'mobile-native-qr-camera' || target.id === 'mobile-native-qr-camera-alt') {
        const file = target.files && target.files[0];
        if (file) {
          decodeQRFromNativeCameraFile(file);
          target.value = '';
        }
      } else if (target.id === 'hist-type-select') {
        state.historyTypeFilter = target.value;
        renderApp();
      } else if (target.id === 'print-layout-select') {
        state.labelLayout = target.value;
        renderApp();
      } else if (target.getAttribute('data-action') === 'change-user-role') {
        const usr = state.users.find((u) => u.id === target.getAttribute('data-id'));
        if (usr && !usr.isPrimaryAdmin && isAdmin() && supabaseClient) {
          const { error } = await supabaseClient.from('profiles')
            .update({ role: roleToDatabase(target.value) }).eq('id', usr.id);
          if (error) { notify('Não foi possível alterar o perfil: ' + error.message, 'error'); return; }
          usr.role = target.value;
          renderApp();
          notify(`Permissão de ${usr.name} alterada para ${usr.role}.`, 'success');
        }
      }
    });

    document.addEventListener('input', (e) => {
      const target = e.target;
      if (target.id === 'global-search-input') {
        state.globalSearch = target.value;
        if (state.activeTab !== 'inventory' && target.value.trim().length > 1) {
          stopLiveScannerCamera();
          state.activeTab = 'inventory';
        }
        renderApp();
        const inputEl = document.getElementById('global-search-input');
        if (inputEl) {
          inputEl.focus();
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        }
      } else if (target.id === 'reg-eq-name') {
        state.regName = target.value;
      } else if (target.id === 'reg-eq-brandmodel') {
        state.regBrandModel = target.value;
      } else if (target.id === 'reg-eq-serial') {
        state.regSerialNumber = target.value;
      } else if (target.id === 'reg-eq-desc') {
        state.regDescription = target.value;
      } else if (target.hasAttribute('data-accessory-index')) {
        const index = Number(target.getAttribute('data-accessory-index'));
        const field = target.getAttribute('data-accessory-field');
        if (Number.isInteger(index) && state.regAccessories[index] && ['name', 'quantity', 'notes'].includes(field)) {
          state.regAccessories[index][field] = field === 'quantity' ? Math.max(1, Number(target.value) || 1) : target.value;
        }
      } else if (target.id === 'hist-search-input') {
        state.historySearch = target.value;
        renderApp();
        const el = document.getElementById('hist-search-input');
        if (el) {
          el.focus();
          el.setSelectionRange(el.value.length, el.value.length);
        }
      }
    });

    // Submissão de todos os formulários
    document.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;

      if (form.id === 'login-form') {
        if (loginSubmissionInProgress) return;
        const email = document.getElementById('login-email').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;
        const submitButton = form.querySelector('button[type="submit"]');
        loginSubmissionInProgress = true;
        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = 'Entrando... aguarde';
          submitButton.classList.add('opacity-60', 'cursor-wait');
        }
        state.authEmail = email;
        state.authPassword = '';
        try {
          await submitCloudLogin(email, pass);
        } catch (error) {
          state.authError = error.message || 'E-mail ou senha inválidos.';
          renderApp();
        } finally {
          loginSubmissionInProgress = false;
        }
      }

      else if (form.id === 'register-request-form') {
        const name = document.getElementById('reg-req-name').value.trim();
        const email = document.getElementById('reg-req-email').value.trim().toLowerCase();
        const password = document.getElementById('reg-req-pass').value;
        const dept = document.getElementById('reg-req-dept').value.trim();
        try {
          await submitCloudRegistration(name, email, password, dept);
        } catch (error) {
          state.authError = error.message || 'Não foi possível enviar o cadastro.';
          renderApp();
        }
      }

      else if (form.id === 'manual-scan-form') {
        const val = document.getElementById('manual-scan-input').value;
        processCodeScan(val);
      }

      else if (form.id === 'quick-checkout-form') {
        if (!checkPermission(['ADMIN', 'GERENCIADOR', 'OPERADOR'])) return;
        const unit = state.units.find((u) => u.id === state.scannedUnitId);
        if (!unit || unit.status !== 'DISPONÍVEL') return;

        const holder = document.getElementById('chk-holder').value.trim();
        const project = document.getElementById('chk-project').value.trim();
        const expRet = document.getElementById('chk-return-dt').value;

        unit.status = 'RETIRADO';
        unit.currentHolder = holder;
        unit.currentProject = project;
        unit.checkoutDate = new Date().toISOString();
        unit.expectedReturnDate = new Date(expRet).toISOString();
        unit.location = `Em Produção: ${project}`;
        unit.usageCount = (unit.usageCount || 0) + 1;

        state.movements.unshift({
          id: `mov-out-${Date.now()}`,
          type: 'RETIRADA',
          unitId: unit.id,
          unitCode: unit.code,
          unitName: unit.name,
          holderName: holder,
          purpose: 'Retirada via Central de Bipagem',
          project,
          timestamp: new Date().toISOString(),
          expectedReturn: unit.expectedReturnDate,
          authorizedBy: state.currentUser.name,
          status: 'EM ABERTO'
        });

        persistState();
        state.scannerActiveOp = 'RETURN';
        state.scannerReturnedBy = holder;
        renderApp();
        notify(`Retirada de ${unit.code} confirmada!`, 'success');
      }

      else if (form.id === 'quick-return-form') {
        if (!checkPermission(['ADMIN', 'GERENCIADOR', 'OPERADOR'])) return;
        const unit = state.units.find((u) => u.id === state.scannedUnitId);
        if (!unit || unit.status !== 'RETIRADO') return;

        const retBy = document.getElementById('ret-holder').value.trim();
        const cond = document.getElementById('ret-cond').value;
        const loc = document.getElementById('ret-loc').value;

        const nextStatus = cond === 'PERFEITO' ? 'DISPONÍVEL' : cond === 'AVARIADO' ? 'AVARIADO' : 'EM MANUTENÇÃO';
        const nextCondLabel = cond === 'PERFEITO' ? 'Perfeito' : cond === 'AVARIADO' ? 'Com Avarias' : 'Necessita Manutenção';

        const prevProject = unit.currentProject || 'Produção';
        unit.status = nextStatus;
        unit.condition = nextCondLabel;
        unit.location = nextStatus === 'DISPONÍVEL' ? loc : 'Laboratório de Manutenção Técnica';
        unit.currentHolder = null;
        unit.currentProject = null;
        unit.checkoutDate = null;
        unit.expectedReturnDate = null;

        state.movements.unshift({
          id: `mov-ret-${Date.now()}`,
          type: 'DEVOLUÇÃO',
          unitId: unit.id,
          unitCode: unit.code,
          unitName: unit.name,
          holderName: retBy || 'Equipe de Set',
          purpose: `Devolução ao Estoque (${nextCondLabel})`,
          project: prevProject,
          timestamp: new Date().toISOString(),
          authorizedBy: state.currentUser.name,
          status: 'CONCLUÍDO'
        });

        persistState();
        state.scannerActiveOp = nextStatus === 'DISPONÍVEL' ? 'CHECKOUT' : null;
        renderApp();
        notify(`Devolução de ${unit.code} registrada! Equipamento de volta ao estoque.`, 'success');
      }

      else if (form.id === 'register-equipment-form') {
        if (!checkPermission(['ADMIN', 'GERENCIADOR'])) return;
        const editing=state.regEditUnitId?state.units.find(u=>u.id===state.regEditUnitId):null;
        if(state.regEditUnitId&&!editing){notify('Equipamento não encontrado para edição.','error');return;}
        const uniqueCode=editing?editing.code:generateUniquePatrimonialCode(state.regCategory);
        const finalSerial=state.regSerialNumber.trim()?state.regSerialNumber.trim().toUpperCase():`SN-${uniqueCode.split('-').slice(1).join('-')}`;
        if(state.units.some(u=>u.id!==editing?.id&&(u.serialNumber||'').toLowerCase()===finalSerial.toLowerCase())){notify('Este Número de Série já está cadastrado!','error');return;}
        const cleanBM=state.regBrandModel.trim()||state.regName.trim(); const parts=cleanBM.split(/\s+/).filter(Boolean);
        const fields={name:state.regName.trim(),brand:parts[0]||'Oliv Films',model:parts.slice(1).join(' '),serialNumber:finalSerial,category:state.regCategory,description:state.regDescription.trim()||'Equipamento operacional do acervo Oliv Films.',accessories:state.regAccessories.filter(item=>item.name.trim()).map(item=>({name:item.name.trim(),quantity:Math.max(1,Number(item.quantity)||1),notes:(item.notes||'').trim()})),condition:state.regCondition,location:state.regLocation,photos:[...state.regPhotos]};
        let savedUnit;
        if(editing){Object.assign(editing,fields);savedUnit=editing;state.movements.unshift({id:`mov-edit-${Date.now()}`,type:'EDIÇÃO',unitId:editing.id,unitCode:editing.code,unitName:editing.name,holderName:editing.status==='RETIRADO'?(editing.currentHolder||''):editing.location,purpose:'Atualização dos dados cadastrais do equipamento',project:'Acervo Oliv Films',timestamp:new Date().toISOString(),authorizedBy:state.currentUser.name,status:'CONCLUÍDO'});}
        else{savedUnit={id:`unit-${Date.now()}`,code:uniqueCode,...fields,acquisitionValue:0,status:'DISPONÍVEL',notes:'',usageCount:0};state.units.push(savedUnit);state.movements.unshift({id:`mov-reg-${Date.now()}`,type:'CADASTRO',unitId:savedUnit.id,unitCode:savedUnit.code,unitName:savedUnit.name,holderName:savedUnit.location,purpose:'Cadastro de Equipamento e Geração de QR Code',project:'Acervo Oliv Films',timestamp:new Date().toISOString(),authorizedBy:state.currentUser.name,status:'CONCLUÍDO'});}
        state.regEditUnitId=null;state.regName='';state.regBrandModel='';state.regSerialNumber='';state.regDescription='';state.regAccessories=[];state.regPhotos=[];state.selectedUnitDetailId=savedUnit.id;persistState();renderApp();
        notify(editing?`Equipamento ${uniqueCode} atualizado com sucesso!`:`Equipamento ${uniqueCode} cadastrado com sucesso!`,'success');
      }

      else if (form.id === 'create-category-form') {
        if (!checkPermission(['ADMIN', 'GERENCIADOR'])) return;
        const name = document.getElementById('new-cat-name').value.trim();
        const prefix = document.getElementById('new-cat-prefix').value.trim().toUpperCase().slice(0, 3);
        if (!name || !prefix) return;

        state.categories.push({ id: `cat-${Date.now()}`, name, prefix, subcategories: ['Geral'] });
        persistState();
        renderApp();
        notify(`Categoria ${name} (${prefix}) criada!`, 'success');
      }

      else if (form.id === 'open-maint-form') {
        if (!checkPermission(['ADMIN', 'GERENCIADOR'])) return;
        const uid = document.getElementById('maint-unit-id').value;
        const reason = document.getElementById('maint-reason').value.trim();
        const unit = state.units.find((u) => u.id === uid);
        if (!unit) return;

        unit.status = 'EM MANUTENÇÃO';
        unit.condition = 'Em Revisão Técnica';
        unit.location = 'Laboratório de Manutenção Técnica';
        unit.notes = reason;

        state.movements.unshift({
          id: `mov-mnt-${Date.now()}`,
          type: 'MANUTENÇÃO',
          unitId: unit.id,
          unitCode: unit.code,
          unitName: unit.name,
          holderName: 'Laboratório Técnico Oliv Films',
          purpose: reason,
          project: 'Ordem de Serviço Interna',
          timestamp: new Date().toISOString(),
          authorizedBy: state.currentUser.name,
          status: 'EM MANUTENÇÃO'
        });
        persistState();
        renderApp();
        notify(`O.S. aberta para ${unit.code}.`, 'info');
      }

      else if (form.id === 'admin-create-user-form') {
        if (!isAdmin()) return;
        const name = document.getElementById('usr-new-name').value.trim();
        const email = document.getElementById('usr-new-email').value.trim().toLowerCase();
        const password = document.getElementById('usr-new-pass').value.trim();
        const role = document.getElementById('usr-new-role').value;

        if (state.users.some((u) => u.email.toLowerCase() === email)) {
          notify('Este e-mail já está cadastrado.', 'error');
          return;
        }
        state.users.push({
          id: `usr-${Date.now()}`,
          name,
          email,
          password,
          department: 'Equipe Oliv Films',
          role,
          status: 'APROVADO',
          isPrimaryAdmin: false,
          createdAt: new Date().toISOString()
        });
        persistState();
        renderApp();
        notify(`Usuário ${name} criado e aprovado!`, 'success');
      }

      else if (form.id === 'save-settings-form') {
        if (!isManagerOrAdmin()) return;
        state.companySettings.companyName = document.getElementById('set-company-name').value.trim() || 'OLIV FILMS';
        state.companySettings.codePrefix = (document.getElementById('set-code-prefix').value.trim() || 'OLF').toUpperCase();
        state.companySettings.ownerContactName = document.getElementById('set-owner-name').value.trim();
        state.companySettings.ownerWhatsapp = document.getElementById('set-owner-wa').value.trim();
        state.companySettings.ownerPhoneDisplay = document.getElementById('set-owner-phone').value.trim();
        state.companySettings.ownerEmail = document.getElementById('set-owner-email').value.trim();
        persistState();
        renderApp();
        notify('Configurações e diretório QR Code atualizados!', 'success');
      }

      else if (form.id === 'add-location-form') {
        if (!isManagerOrAdmin()) return;
        const loc = document.getElementById('new-loc-input').value.trim();
        if (loc && !state.locations.includes(loc)) {
          state.locations.push(loc);
          persistState();
          renderApp();
          notify('Localização adicionada ao estoque!', 'success');
        }
      }
    });

    // Atalho global da tecla ESC (fecha janelas sobrepostas ou retorna a aba ativa para o Dashboard) + Leitor USB
    let usbScannerBuffer = '';
    let usbLastKeyTime = 0;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.lostFoundUnit) { state.lostFoundUnit = null; renderApp(); return; }
        if (state.printableDocument) { state.printableDocument = null; renderApp(); return; }
        if (state.selectedUnitDetailId) { state.selectedUnitDetailId = null; renderApp(); return; }
        if (state.mobileMenuOpen) { state.mobileMenuOpen = false; renderApp(); return; }
        if (state.showNotificationsDrawer) { state.showNotificationsDrawer = false; renderApp(); return; }
        if (state.showUserMenu) { state.showUserMenu = false; renderApp(); return; }
        if (state.isAuthenticated && state.activeTab !== 'dashboard') {
          navigateToTab('dashboard');
        }
        return;
      }

      // Captura automática de leitor físico de QR/Código de Barras quando na Central de Bipagem
      if (state.isAuthenticated && state.activeTab === 'scanner') {
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        const now = Date.now();
        if (now - usbLastKeyTime > 120) {
          usbScannerBuffer = '';
        }
        usbLastKeyTime = now;

        if (e.key === 'Enter' && usbScannerBuffer.length >= 3) {
          e.preventDefault();
          const scanned = usbScannerBuffer;
          usbScannerBuffer = '';
          processCodeScan(scanned);
        } else if (e.key.length === 1) {
          usbScannerBuffer += e.key;
        }
      }
    });

    // Desativa a câmera automaticamente se o navegador for minimizado/trocado de aba e reativa ao voltar na Central de Bipagem
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (liveCameraStream || liveCameraStarting || liveScanRafId) {
          stopLiveScannerCamera();
        }
      } else if (state.isAuthenticated && state.activeTab === 'scanner') {
        state.scannerCameraActive = true;
        state.scannerErrorMsg = '';
        syncLiveScannerCamera();
      }
    });

    window.addEventListener('pagehide', () => {
      stopLiveScannerCamera();
    });

    // Inicialização e verificação de parâmetros de Achados e Perdidos (?achado=OLF-CAM-000001)
    window.onload = async function () {
      const params = new URLSearchParams(window.location.search);
      const achado = params.get('achado') || params.get('eqp');
      const fallbackFoundUnit = achado ? {
        code: achado.toUpperCase(),
        name: 'Equipamento Cinematográfico Oliv Films',
        serialNumber: 'Identificado via QR Code'
      } : null;

      if (!supabaseClient) {
        state.lostFoundUnit = fallbackFoundUnit;
        state.authError = 'Conexão com o Supabase não carregou. Atualize a página ou confira supabase-config.js.';
        renderApp();
        return;
      }

      console.info('[Oliv Films] Inicialização: verificando sessão salva...');
      const sessionStartedAt = performance.now();
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      console.info('[Oliv Films] Inicialização: verificação de sessão em', Math.round(performance.now() - sessionStartedAt) + ' ms', '| sessão encontrada:', Boolean(sessionData?.session?.user));
      if (sessionError) console.error('[Oliv Films] Erro ao recuperar sessão salva:', sessionError);

      if (sessionData?.session?.user) {
        await finishCloudLogin(sessionData.session.user, 'restauração automática');
        if (achado) state.lostFoundUnit = findUnitByScannedValue(achado) || fallbackFoundUnit;
      } else if (achado) {
        // Visitantes sem login consultam somente os campos públicos do item identificado.
        try {
          const { data, error } = await supabaseClient.rpc('lookup_equipment_for_found_item', { p_code: achado });
          if (error) throw error;
          state.lostFoundUnit = data || fallbackFoundUnit;
        } catch (error) {
          console.error('[Oliv Films] Não foi possível consultar o item pelo QR Code:', error);
          state.lostFoundUnit = fallbackFoundUnit;
        }
        renderApp();
      } else {
        renderApp();
      }

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') {
          stopProfileRealtime();
          stopOperationalDataRealtime();
          cloudReady = false;
          state.isAuthenticated = false;
          state.currentUser = null;
          renderApp();
        }
      });
    };
  </script>
</body>
</html>
